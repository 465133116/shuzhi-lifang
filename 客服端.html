function toggleBatch(){_batchMode=!_batchMode;var cbs=document.querySelectorAll('.batch-cb');cbs.forEach(function(cb){cb.classList.toggle('h',!_batchMode)});var bt=document.getElementById('batch-toggle');if(bt)bt.innerText=_batchMode?'取消':'批量操作';var bb=document.getElementById('batch-bar');if(bb)bb.classList.toggle('h',!_batchMode);if(!_batchMode)batchClear()}
function updateBatch(){var cbs=document.querySelectorAll('.batch-cb:checked');var bc=document.getElementById('batch-count');if(bc)bc.innerText=cbs.length}
function batchClear(){document.querySelectorAll('.batch-cb').forEach(function(cb){cb.checked=false});updateBatch()}
function batchMark(){var ids=[];document.querySelectorAll('.batch-cb:checked').forEach(function(cb){ids.push(parseInt(cb.value))});if(ids.length===0){alert('请先勾选业主');return}if(!confirm('确认将'+ids.length+'户标记为已拨打？'))return;ids.forEach(function(id){var o=D.o.find(function(x){return x.id===id});if(o){o.cs='ok';o.ct=now();o.cr='已接通·无争议';alc(id,'外呼','批量标记','')}});save();batchClear();rc();alert('已标记'+ids.length+'户')}
function batchSms(){var ids=[];document.querySelectorAll('.batch-cb:checked').forEach(function(cb){ids.push(parseInt(cb.value))});if(ids.length===0){alert('请先勾选业主');return}var list=ids.map(function(id){var o=D.o.find(function(x){return x.id===id});return o?o.r+' '+o.n+o.g:''}).join(',');if(!confirm('确认向以下'+ids.length+'户发送短信？\n\n'+list+'\n\n短信：【杭州个信数治】小区在线服务平台已启用。'))return;ids.forEach(function(id){var o=D.o.find(function(x){return x.id===id});if(o){alc(id,'短信','批量发送','');an('done','短信已发送','批量发送至 '+o.r+' '+o.n,id)}});save();batchClear();rc();alert('短信已发送至'+ids.length+'户')}</script></body></html>
