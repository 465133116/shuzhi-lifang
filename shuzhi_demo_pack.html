.gantt-ticks{position:absolute;top:0;left:0;right:0;height:26px;border-bottom:1px solid var(--line);z-index:3;background:#fafbfd;}
.g-tick{position:absolute;top:0;bottom:0;border-left:1px solid #eef1f6;}
.g-tick.major{border-left-color:#dde3eb;}
.g-tick span{position:absolute;top:5px;left:4px;font-size:10px;color:#94a3b8;font-family:Consolas,monospace;white-space:nowrap;}
.gantt-rows{position:absolute;top:26px;left:0;right:0;bottom:0;}
.g-row{position:absolute;left:0;right:0;height:38px;border-bottom:1px solid #f1f5f9;background:#fff;}
.g-row.cur{background:#f8fbff;}
.g-seg{
  position:absolute;top:7px;height:24px;border-radius:5px;cursor:pointer;
  display:flex;align-items:center;padding:0 5px;color:#fff;font-size:10px;font-weight:700;
  font-family:Consolas,monospace;overflow:hidden;white-space:nowrap;
  box-shadow:inset 0 -6px 10px rgba(0,0,0,.14),0 1px 2px rgba(0,0,0,.12);
  transition:filter .12s,transform .12s;
}
.g-seg:hover{filter:brightness(1.12);transform:translateY(-1px);z-index:4;}
.g-seg.clean{}
.g-seg.complaint{background:linear-gradient(180deg,#f87171,#dc2626);animation:segglow 1.4s ease-in-out infinite;}
@keyframes segglow{0%,100%{box-shadow:inset 0 -6px 10px rgba(0,0,0,.14),0 1px 2px rgba(0,0,0,.12);}50%{box-shadow:inset 0 -6px 10px rgba(0,0,0,.14),0 0 10px rgba(220,38,38,.7);}}
.g-seg.charge{background:linear-gradient(180deg,#e2e8f0,#cbd5e1);color:#64748b;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 4px,transparent 4px 8px);}
.g-seg.hls{outline:2px solid #f59e0b;outline-offset:1px;z-index:5;}
.g-nowline{position:absolute;top:26px;bottom:0;width:0;border-left:1.5px dashed #f43f5e;z-index:6;pointer-events:none;}
.g-nowline span{position:absolute;top:2px;left:3px;background:#f43f5e;color:#fff;font-size:9.5px;padding:1px 5px;border-radius:4px;font-family:Consolas,monospace;white-space:nowrap;}

/* ════════ 明细表 ════════ */
.detail-wrap{padding:12px 16px 16px;}
.detail-title{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:var(--ink2);margin-bottom:8px;}
.detail-title .dt-c{width:3px;height:14px;border-radius:2px;}
.tl-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.tl-table th{
  background:#f8fafc;color:var(--ink2);font-weight:700;font-size:11.5px;text-align:left;
  padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
}
.tl-table td{padding:8px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle;}
.tl-table tbody tr{transition:background .1s;}
.tl-table tbody tr:hover td{background:#f8fafc;}
.tl-table tr.complaint-row td{background:#fff7f7;}
.tl-table tr.complaint-row:hover td{background:#fef2f2;}
.tl-table tr.now-row td{background:var(--r1l);}
.tl-table tr.hl-row td{background:#fef9ec;}
.tl-time{font-family:Consolas,monospace;font-size:12px;white-space:nowrap;}
.tl-seg{display:inline-block;font-family:Consolas,monospace;font-size:11px;font-weight:800;padding:2px 8px;border-radius:10px;}
.tl-type{font-size:10.5px;padding:2px 8px;border-radius:9px;font-weight:700;white-space:nowrap;}
.tl-type.clean{background:#eef2ff;color:#4338ca;}
.tl-type.complaint{background:#fee2e2;color:#b91c1c;}
.tl-type.charge{background:#f3f4f6;color:#6b7280;}
.now-badge{font-size:10px;background:#2563eb;color:#fff;padding:2px 7px;border-radius:9px;font-weight:700;margin-left:6px;white-space:nowrap;}
.tl-nums{text-align:right;font-family:Consolas,monospace;font-size:12px;white-space:nowrap;}
.tl-note{color:#c2cad4;font-size:11px;}
.page-foot{font-size:12px;color:#9ca3af;text-align:center;line-height:1.9;padding:2px 0 10px;}

/* ═══════════ 工具 ═══════════ */
function toMin(t){ var a=t.split(&#39;:&#39;); return (+a[0])*60 + (+a[1]); }
function durMin(s,e){ return toMin(e)-toMin(s); }
function fmtDur(m){ var h=Math.floor(m/60), r=m%60; return h&gt;0 ? h+&#39;小时&#39;+(r&gt;0?r+&#39;分&#39;:&#39;&#39;) : r+&#39;分&#39;; }
function fmtKm(v){ return v.toFixed(1); }
function esc(s){ return String(s).replace(/&amp;/g,&#39;&amp;amp;&#39;).replace(/&lt;/g,&#39;&amp;lt;&#39;); }

function calcStats(r){
  var sqm=0, km=0, workMin=0, compCount=0, arrSum=0;
  r.tasks.forEach(function(t){
    sqm += t.sqm || 0; km += t.km || 0;
    if(t.type !== &#39;charge&#39;){ workMin += durMin(t.s, t.e); }
    if(t.type === &#39;complaint&#39;){
      compCount++;
      var c = COMPLAINTS.filter(function(x){ return x.id === t.cid; })[0];
      if(c){ var m = c.arrive.match(/（(\d+)\s*分钟）/); if(m){ arrSum += +m[1]; } }
    }
  });
  var totalMin = 0; r.tasks.forEach(function(t){ totalMin += durMin(t.s,t.e); });
  return {
    sqm:sqm, km:km, workMin:workMin, workText:fmtDur(workMin), totalText:fmtDur(totalMin),
    compCount:compCount, avgArr:compCount&gt;0?(arrSum/compCount).toFixed(1):&#39;—&#39;, taskCount:r.tasks.length
  };
}

function findNowTask(r){
  for(var i=0;i&lt;r.tasks.length;i++){
    var t=r.tasks[i];
    if(toMin(t.s) &lt;= toMin(DEMO_TIME) &amp;&amp; toMin(DEMO_TIME) &lt; toMin(t.e)) return t;
  }
  return null;
}

/* ═══════════ 投诉详情 ═══════════ */
function showComplaint(cid){
  selComplaint = cid;
  var c = COMPLAINTS.filter(function(x){ return x.id===cid; })[0];
  var r = ROBOTS[c.robot];
  var html = &#39;&lt;div class=&quot;c-detail&quot;&gt;&#39;
    + &#39;&lt;div class=&quot;cd-head&quot;&gt;&lt;span style=&quot;width:4px;height:18px;background:&#39;+r.color+&#39;;border-radius:2px;&quot;&gt;&lt;/span&gt;&#39;
    + &#39;&lt;span class=&quot;cd-title&quot;&gt;&#39;+c.id+&#39; · &#39;+c.title+&#39;&lt;/span&gt;&#39;
    + &#39;&lt;button class=&quot;cd-close&quot; onclick=&quot;hideComplaint()&quot;&gt;✕&lt;/button&gt;&lt;/div&gt;&#39;
    + step(c.received, true) + step(c.dispatched, false) + step(c.cmd, false) + step(c.depart, false)
    + step(c.arrive, false) + step(c.cleanStart+&#39;（持续 &#39;+c.cleanMin+&#39; 分钟）&#39;, false) + step(c.cleanEnd, false)
    + step(c.done, false) + step(c.accept, false)
    + &#39;&lt;div class=&quot;cd-route&quot;&gt;🗺 地图对应段：&lt;b style=&quot;color:&#39;+r.color+&#39;;&quot;&gt;&#39;+c.seg+&#39;&lt;/b&gt;（&#39;+r.name+&#39; 路线，红色脉冲点即投诉位置）&lt;/div&gt;&#39;
    + &#39;&lt;/div&gt;&#39;;
  document.getElementById(&#39;complaintDetail&#39;).innerHTML = html;
  renderComplaints();
  if(currentId !== c.robot){ selectRobot(c.robot); } else { highlightRoutes(); }
  highlightComplaintOnMap(c, true);
  var rows = document.querySelectorAll(&#39;#tlBody tr&#39;);
  rows.forEach(function(tr){
    if(tr.getAttribute(&#39;data-seg&#39;) === c.seg){ tr.classList.add(&#39;hl-row&#39;); tr.scrollIntoView({block:&#39;nearest&#39;}); }
  });
  function step(txt, isFirst){
    return &#39;&lt;div class=&quot;c-step&#39;+(isFirst?&#39; hl-step&#39;:&#39;&#39;)+&#39;&quot;&gt;&lt;span class=&quot;t&quot;&gt;&#39;+txt.split(&#39; &#39;)[0]+&#39;&lt;/span&gt;&lt;span class=&quot;d&quot;&gt;&#39;+txt.split(&#39; &#39;).slice(1).join(&#39; &#39;)+&#39;&lt;/span&gt;&lt;/div&gt;&#39;;
  }
}
function hideComplaint(){
  selComplaint = null;
  document.getElementById(&#39;complaintDetail&#39;).innerHTML = &#39;&#39;;
  renderComplaints();
  document.querySelectorAll(&#39;.complaint-group&#39;).forEach(function(g){ g.classList.remove(&#39;zoom&#39;); });
  document.querySelectorAll(&#39;.complaint-dot&#39;).forEach(function(d){ d.setAttribute(&#39;r&#39;, 6); });
  document.querySelectorAll(&#39;#tlBody tr.hl-row&#39;).forEach(function(tr){ tr.classList.remove(&#39;hl-row&#39;); });
  clearHl();
}

function highlightComplaintOnMap(c, on){

/* ═══════════ Gantt 时间轴 ═══════════ */
function pctOf(m){ return ((m - GSTART)/GSPAN*100).toFixed(3)+&#39;%&#39;; }
function renderGantt(){
  // 刻度
  var tickHtml = &#39;&#39;;
  for(var m=GSTART; m&lt;=GEND; m+=30){
    var major = (m%120===0);
    var lbl = major ? String(Math.floor(m/60)).padStart(2,&#39;0&#39;)+&#39;:&#39;+String(m%60).padStart(2,&#39;0&#39;) : &#39;&#39;;
    tickHtml += &#39;&lt;div class=&quot;g-tick&#39;+(major?&#39; major&#39;:&#39;&#39;)+&#39;&quot; style=&quot;left:&#39;+pctOf(m)+&#39;;&quot;&gt;&#39;+(lbl?&#39;&lt;span&gt;&#39;+lbl+&#39;&lt;/span&gt;&#39;:&#39;&#39;)+&#39;&lt;/div&gt;&#39;;
  }
  document.getElementById(&#39;ganttTicks&#39;).innerHTML = tickHtml;
  // 标签列
  var lblHtml = &#39;&#39;, order=[&#39;R01&#39;,&#39;R02&#39;,&#39;R03&#39;];
  order.forEach(function(id){
    var r = ROBOTS[id];
    lblHtml += &#39;&lt;div class=&quot;g-lbl&#39;+(id===currentId?&#39; cur&#39;:&#39;&#39;)+&#39;&quot; data-rid=&quot;&#39;+id+&#39;&quot; style=&quot;border-left-color:&#39;+(id===currentId?r.color:&#39;transparent&#39;)+&#39;;&quot;&gt;&#39;
      + &#39;&lt;span class=&quot;g-dot&quot; style=&quot;background:&#39;+r.color+&#39;;&quot;&gt;&lt;/span&gt;&#39;
      + &#39;&lt;span class=&quot;g-nm&quot;&gt;&#39;+r.name+&#39;&lt;/span&gt;&lt;span class=&quot;g-st&quot;&gt;工作中&lt;/span&gt;&#39;
      + &#39;&lt;/div&gt;&#39;;
  });
  document.getElementById(&#39;ganttLabels&#39;).innerHTML = lblHtml;
  document.querySelectorAll(&#39;.g-lbl&#39;).forEach(function(el){
    el.addEventListener(&#39;click&#39;, function(){ selectRobot(el.getAttribute(&#39;data-rid&#39;)); });
  });
  // 行与段条
  var rowsHtml = &#39;&#39;;
  order.forEach(function(id, i){
    var r = ROBOTS[id];
    var segHtml = &#39;&#39;;
    r.tasks.forEach(function(t){
      var left = pctOf(toMin(t.s)), w = ((durMin(t.s,t.e))/GSPAN*100).toFixed(3)+&#39;%&#39;;
      var cls = t.type===&#39;complaint&#39; ? &#39;complaint&#39; : (t.type===&#39;charge&#39; ? &#39;charge&#39; : &#39;clean&#39;);
      var bg = t.type===&#39;clean&#39; ? &#39;linear-gradient(180deg,&#39;+r.color+&#39; 0%,&#39;+r.color+&#39;cc 60%)&#39; : &#39;&#39;;
      var label = t.type===&#39;charge&#39; ? &#39;&#39; : t.seg;
      segHtml += &#39;&lt;div class=&quot;g-seg &#39;+cls+&#39;&quot; data-rid=&quot;&#39;+id+&#39;&quot; data-seg=&quot;&#39;+t.seg+&#39;&quot; &#39;
        + &#39;style=&quot;left:&#39;+left+&#39;;width:&#39;+w+&#39;;&#39;+(bg?&#39;background:&#39;+bg+&#39;;&#39;:&#39;&#39;)+&#39;&quot; title=&quot;&quot;&gt;&#39;+label+&#39;&lt;/div&gt;&#39;;
    });
    rowsHtml += &#39;&lt;div class=&quot;g-row&#39;+(id===currentId?&#39; cur&#39;:&#39;&#39;)+&#39;&quot; data-rid=&quot;&#39;+id+&#39;&quot;&gt;&#39;+segHtml+&#39;&lt;/div&gt;&#39;;
  });
  document.getElementById(&#39;ganttRows&#39;).innerHTML = rowsHtml;
  // 当前时刻线
  var nl = document.getElementById(&#39;ganttNowline&#39;);
  var nlPct = Math.max(0, Math.min(100, ((toMin(DEMO_TIME)-GSTART)/GSPAN*100)));
  nl.style.left = nlPct+&#39;%&#39;;
  nl.querySelector(&#39;span&#39;).textContent = DEMO_TIME;
  // 段条事件
  document.querySelectorAll(&#39;.g-seg&#39;).forEach(function(el){
    var rid = el.getAttribute(&#39;data-rid&#39;), seg = el.getAttribute(&#39;data-seg&#39;);
    el.addEventListener(&#39;click&#39;, function(){
      selectRobot(rid);
      var t = ROBOTS[rid].tasks.filter(function(x){ return x.seg===seg; })[0];
      if(t &amp;&amp; t.cid){ showComplaint(t.cid); return; }
      hlSeg(seg, true);
      document.querySelectorAll(&#39;#tlBody tr&#39;).forEach(function(tr){
        if(tr.getAttribute(&#39;data-seg&#39;)===seg){ tr.classList.add(&#39;hl-row&#39;); tr.scrollIntoView({block:&#39;center&#39;}); }
      });
      setTimeout(function(){ hlSeg(seg, false); document.querySelectorAll(&#39;#tlBody tr.hl-row&#39;).forEach(function(tr){tr.classList.remove(&#39;hl-row&#39;);}); }, 2500);
    });
    el.addEventListener(&#39;mouseenter&#39;, function(){ hlSegR(rid, seg, true); });
    el.addEventListener(&#39;mouseleave&#39;, function(){ hlSegR(rid, seg, false); });
  });
}

/* ═══════════ 路线回放 ═══════════ */
var replayActive = false, replayTimer = null, animRaf = null, replayIdx = 0;
function replayCurrent(){
  stopReplay(true);
  var r = ROBOTS[currentId];
  var dot = document.querySelector(&#39;#dot-&#39;+currentId+&#39; .robod-dot&#39;);
  var seq = r.tasks.map(function(t){ return { paths:t.paths, seg:t.seg, t:t }; });
  document.getElementById(&#39;btnReplay&#39;).disabled = true;
  document.getElementById(&#39;btnStop&#39;).disabled = false;
  replayActive = true;
  replayIdx = 0;
  function playSeg(){
    if(!replayActive){ return; }
    if(replayIdx &gt;= seq.length){ stopReplay(); return; }
    var item = seq[replayIdx];
    hlSeg(item.seg, true);
    document.getElementById(&#39;demoClock&#39;).textContent = &#39;回放 &#39;+item.seg+&#39; &#39;+item.t.s;
    var p0 = document.getElementById(item.paths[0]);
    if(p0){
      var len = p0.getTotalLength(), t0 = null;
      function stepAnim(ts){
        if(!replayActive){ return; }
        if(!t0){ t0 = ts; }
        var k = Math.min(1, (ts - t0)/1050);
        var pt = p0.getPointAtLength(len * k);
        dot.setAttribute(&#39;cx&#39;, pt.x);
        dot.setAttribute(&#39;cy&#39;, pt.y);
        if(k &lt; 1){ animRaf = requestAnimationFrame(stepAnim); }
        else { replayIdx++; setTimeout(playSeg, 200); }
      }
      animRaf = requestAnimationFrame(stepAnim);
    } else { replayIdx++; setTimeout(playSeg, 200); }
  }
  playSeg();
}
function stopReplay(reset){
  replayActive = false;
  if(animRaf){ cancelAnimationFrame(animRaf); animRaf = null; }
  if(replayTimer){ clearTimeout(replayTimer); replayTimer = null; }
  clearHl();
  document.getElementById(&#39;btnReplay&#39;).disabled = false;
  document.getElementById(&#39;btnStop&#39;).disabled = true;
  document.getElementById(&#39;demoClock&#39;).textContent = currentClock();
  highlightRoutes();
}

/* ═══════════ 地图视口：缩放 / 拖拽平移 ═══════════ */
var vpScale = 1, vpTx = 0, vpTy = 0, vpDragging = false, vpDragStart = null, vpMoved = 0;
function initViewport(){
  var vp = document.getElementById(&#39;mapViewport&#39;);
  if(!vp) return;
  var svg = vp.querySelector(&#39;svg&#39;);
  function apply(){ svg.style.transform = &#39;translate(&#39;+vpTx+&#39;px,&#39;+vpTy+&#39;px) scale(&#39;+vpScale+&#39;)&#39;; }
  function zoomTo(factor, cx, cy){
    var ns = Math.min(3, Math.max(0.6, vpScale*factor));
    var k = ns/vpScale;
    vpTx = cx - (cx - vpTx)*k;
    vpTy = cy - (cy - vpTy)*k;
    vpScale = ns;
    apply();
  }
  function resetView(){
    vpScale = 1; vpTx = 0; vpTy = 0;
    svg.style.transform = &#39;&#39;;
  }
  vp.addEventListener(&#39;wheel&#39;, function(e){
    e.preventDefault();
    var rect = vp.getBoundingClientRect();
    zoomTo(e.deltaY&lt;0 ? 1.16 : 1/1.16, e.clientX-rect.left, e.clientY-rect.top);
  }, {passive:false});
  vp.addEventListener(&#39;mousedown&#39;, function(e){
    if(e.button !== 0) return;
    vpDragging = true; vpMoved = 0;
    vpDragStart = {x:e.clientX, y:e.clientY, tx:vpTx, ty:vpTy};
    vp.classList.add(&#39;dragging&#39;);
    e.preventDefault();
  });
  window.addEventListener(&#39;mousemove&#39;, function(e){
    if(!vpDragging) return;
    var dx = e.clientX - vpDragStart.x, dy = e.clientY - vpDragStart.y;
    vpMoved = Math.max(vpMoved, Math.abs(dx)+Math.abs(dy));
    vpTx = vpDragStart.tx + dx;
    vpTy = vpDragStart.ty + dy;
    apply();
  });
  window.addEventListener(&#39;mouseup&#39;, function(){
    vpDragging = false;
    vp.classList.remove(&#39;dragging&#39;);
  });
  vp.addEventListener(&#39;dblclick&#39;, resetView);
  document.getElementById(&#39;btnZoomIn&#39;).addEventListener(&#39;click&#39;, function(){
    var rect = vp.getBoundingClientRect();
    zoomTo(1.28, rect.width/2, rect.height/2);
  });
  document.getElementById(&#39;btnZoomOut&#39;).addEventListener(&#39;click&#39;, function(){
    var rect = vp.getBoundingClientRect();
    zoomTo(1/1.28, rect.width/2, rect.height/2);
  });
  document.getElementById(&#39;btnZoomReset&#39;).addEventListener(&#39;click&#39;, resetView);
}

/* ═══════════ 实时时钟（右上角时间随当前时刻刷新） ═══════════ */
function currentClock(){
  var d = new Date();
  return &#39;🕐 &#39;+pad2(d.getHours())+&#39;:&#39;+pad2(d.getMinutes())+&#39;:&#39;+pad2(d.getSeconds());
}
function refreshNow(){
  if(replayActive) return;   // 回放期间由回放控制时钟文本
  document.getElementById(&#39;demoClock&#39;).textContent = currentClock();
  var d = new Date();
  var hhmm = pad2(d.getHours())+&#39;:&#39;+pad2(d.getMinutes());
