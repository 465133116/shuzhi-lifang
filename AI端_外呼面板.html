<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>数治理方 AI端·外呼面板</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--p:#2563eb;--d:#dc2626;--s:#16a34a;--w:#f59e0b;--bg:#f1f5f9;--c:#fff;--t:#1e293b;--sub:#64748b;--b:#e2e8f0;--r:10px}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--t);min-height:100vh}
.tn{background:#1e293b;color:#fff;display:flex;align-items:center;padding:0 20px;height:52px;gap:12px}
.tn span{font-weight:700;font-size:15px}.tn .info{font-size:11px;opacity:0.7;margin-left:auto}
.ct{max-width:1400px;margin:0 auto;padding:16px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}
.card{background:var(--c);border-radius:var(--r);padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:12px}
.stat{text-align:center;padding:12px}.stat .n{font-size:24px;font-weight:700}.stat .l{font-size:11px;color:var(--sub);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--b)}th{background:#f8fafc;font-weight:600;color:var(--sub)}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px}.tag-r{background:#fef2f2;color:var(--d)}.tag-g{background:#f0fdf4;color:var(--s)}.tag-y{background:#fffbeb;color:var(--w)}.tag-b{background:#eff6ff;color:var(--p)}.tag-gr{background:#f8fafc;color:var(--sub)}
.btn{display:inline-block;padding:6px 12px;border-radius:6px;border:none;cursor:pointer;font-size:12px;transition:.15s}.btn:hover{opacity:.85}.btn-p{background:var(--p);color:#fff}
.mo{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200}
.md{background:#fff;border-radius:var(--r);padding:24px;max-width:600px;width:90%}
</style></head><body>
<div class="tn"><span>数治理方 · AI端（外呼面板）</span><span class="info">运行中 | 已外呼 125 通</span></div>
<div class="ct">
<div class="g4" style="margin-bottom:16px">
<div class="card stat"><div class="n" style="color:var(--p)">125</div><div class="l">今日外呼</div></div>
<div class="card stat"><div class="n" style="color:var(--s)">82</div><div class="l">已接通</div></div>
<div class="card stat"><div class="n" style="color:var(--d)">15</div><div class="l">有争议</div></div>
<div class="card stat"><div class="n" style="color:var(--w)">28</div><div class="l">待跟进</div></div>
</div>

<tr><td>C002</td><td>李芳</td><td>5-801</td><td>阳光花园</td><td><span class="tag tag-b">通知</span></td><td><span class="tag tag-y">有争议</span></td><td>10:18</td><td><button class="btn btn-p" onclick="showDetail(2)">详情</button></td></tr>
<tr><td>C003</td><td>王强</td><td>2-603</td><td>阳光花园</td><td><span class="tag tag-b">通知</span></td><td><span class="tag tag-r">未接通</span></td><td>10:22</td><td><button class="btn btn-p" onclick="showDetail(3)">详情</button></td></tr>
<tr><td>C004</td><td>刘洋</td><td>1-201</td><td>阳光花园</td><td><span class="tag tag-b">通知</span></td><td><span class="tag tag-r">拒接</span></td><td>10:25</td><td><button class="btn btn-p" onclick="showDetail(4)">详情</button></td></tr>
<tr><td>C005</td><td>陈静</td><td>4-302</td><td>阳光花园</td><td><span class="tag tag-b">通知</span></td><td><span class="tag tag-g">已通知</span></td><td>10:30</td><td><button class="btn btn-p" onclick="showDetail(5)">详情</button></td></tr>
</table></div>
<div class="card"><h3 style="margin-bottom:12px">意图识别统计</h3>
<div class="g3">
<div class="card stat"><div class="n" style="color:var(--s)">52</div><div class="l">无争议</div></div>
<div class="card stat"><div class="n" style="color:var(--w)">15</div><div class="l">有争议</div></div>
<div class="card stat"><div class="n" style="color:var(--d)">5</div><div class="l">拒绝对话</div></div>
<div class="card stat"><div class="n">28</div><div class="l">未接通</div></div>
<div class="card stat"><div class="n">18</div><div class="l">错号/空号</div></div>
<div class="card stat"><div class="n" style="color:var(--p)">7</div><div class="l">已缴费</div></div>
</div></div>
</div>
<div class="mo h" id="modal"><div class="md"><h3 id="mdTitle">通话详情</h3><div id="mdBody"></div><button class="btn btn-o" style="width:100%;margin-top:12px" onclick="document.getElementById('modal').classList.add('h')">关闭</button></div></div>
<script>
var details={
1:{owner:'张建国',room:'3-1502',duration:85,result:'有争议',transcript:'AI: 您好，请问是张建国先生本人吗？
业主: 是。

AI: 您说的情况我记下了，稍后客服会联系您帮您登记。
→ 标记：有争议 → 推送客服端'},
2:{owner:'李芳',room:'5-801',duration:120,result:'有争议',transcript:'AI: 您好，请问是李芳女士本人吗？

3:{owner:'王强',room:'2-603',duration:0,result:'未接通',transcript:'响铃30秒未接听 → 标记：未接通 → 安排重呼'},
4:{owner:'刘洋',room:'1-201',duration:10,result:'拒接',transcript:'接通后挂断 → 标记：拒接 → 安排短信触达'},
5:{owner:'陈静',room:'4-302',duration:45,result:'已通知',transcript:'AI: 您好，请问是陈静女士本人吗？
业主: 是。
AI: 小区上线了在线服务平台...
业主: 好的，知道了。
→ 标记：已通知 → 完成'}
};
function showDetail(id){
var d=details[id];
document.getElementById('mdTitle').innerText='通话详情 - '+d.owner+' ('+d.room+')';
document.getElementById('mdBody').innerHTML='<div style="margin-bottom:12px"><strong>时长：</strong>'+d.duration+'秒 | <strong>结果：</strong><span class="tag '+(d.result==='有争议'?'tag-y':'tag-r')+'">'+d.result+'</span></div><div style="background:#f8fafc;padding:12px;border-radius:6px;font-size:12px;white-space:pre-wrap;line-height:1.8">'+d.transcript+'</div>';
document.getElementById('modal').classList.remove('h');
}
</script></body></html>
