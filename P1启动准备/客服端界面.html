.tag-g{background:#d1fae5;color:#065f46}.tag-gr{background:#f1f5f9;color:#94a3b8}

.btn-sec{background:#f1f5f9;color:#475569}.btn-sec:hover{background:#e2e8f0}

.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:100;justify-content:center;align-items:center}

.modal{background:#fff;border-radius:12px;width:580px;max-height:85vh;overflow-y:auto;padding:20px}

.signal-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.signal-item{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:5px;font-size:11px;background:#f8fafc}
.signal-item.on{font-weight:600}

.timeline-item{padding:5px 0;font-size:10px;border-bottom:1px solid #f1f5f9}
.timeline-item .time{color:#94a3b8;margin-right:6px}
.verify-panel{background:#f8fafc;border-radius:8px;padding:10px;margin-top:12px}
.verify-panel label{display:block;margin:4px 0;font-size:11px;cursor:pointer}
.empty{text-align:center;color:#94a3b8;padding:24px;font-size:12px}

    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="font-size:24px;font-weight:800;color:'+cc[o.cls]+'">'+o.priority+'</span><span class="cls-tag c'+o.cls+'">'+o.cls+"·"+cl[o.cls]+sh+"</span>"+o.aux.map(function(a){return'<span class="cls-aux">+'+cl[a]+"</span>"}).join("")+(o.urgent?' <span class="tag tag-r">'+o.urgent+"</span>":"")+"</div>"+

    '<div style="font-size:10px;color:#64748b">最近："+o.le+" | 工单"+o.orders+"次 · 通话"+o.calls+"次</div></div>"+
    '<div class="modal-section"><h4>信号明细</h4><div class="signal-grid">'+sH+"</div></div>"+

    '<div class="modal-section"><h4>沟通记录</h4>'+lH+"</div>"+
    '<div class="verify-panel"><h4 style="font-size:11px;margin-bottom:6px">本次通话验证分类</h4>'+

    '<label><input type="radio" name="v'+o.id+'"> 跳过（本次无法判断）</label></div>'+
    '<div style="text-align:right;margin-top:12px"><button class="btn btn-pri" onclick="cm()">拨号回访</button> <button class="btn btn-sec" onclick="cm()">关闭</button></div>';

}
