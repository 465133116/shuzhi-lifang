  <rect x="820" y="612" width="790" height="180" rx="10" fill="#0f1a2b" stroke="#f59e0b" stroke-width="2"/>

    <text x="840" y="758" fill="#94a3b8">　　　② promise_count + 1（失信计数 → D类判定素材）</text>
    <text x="840" y="776" fill="#94a3b8">　　　③ call_count 重置为 1（给一次正常回流机会，不重复惩罚）</text>
