<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数治理方 · 采购端 · 社区</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f4f6fa;--card:#ffffff;--card2:#f8fafc;--line:#e2e8f0;
  --tx:#1e293b;--sub:#5b6b7f;--dim:#8b99ab;
  --main:#0891b2;--main-d:#0e7490;
  --g:#059669;--y:#d97706;--r:#dc2626;--p:#7c3aed;--b:#2563eb;--o:#ea580c;--gold:#b45309;
}
html{scrollbar-color:#cbd5e1 transparent}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:14px}
.hd{background:#ffffff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;box-shadow:0 1px 4px rgba(15,23,42,.06)}
.hd-in{max-width:1460px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo .ic{width:38px;height:38px;border-radius:10px;background:rgba(8,145,178,.1);border:1px solid rgba(8,145,178,.3);display:flex;align-items:center;justify-content:center;font-size:19px}
.logo b{font-size:17px;letter-spacing:.5px;color:#0f172a}
.logo span{font-size:11px;color:var(--dim);display:block;margin-top:2px}
.seg{display:flex;background:#f1f5f9;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{padding:7px 15px;font-size:12.5px;background:transparent;border:none;color:var(--sub);cursor:pointer;font-family:inherit;transition:.15s}
.seg button.on{background:var(--main);color:#ffffff;font-weight:700}
.seg button:not(.on):hover{color:var(--tx)}
.seg button.rst{color:#b91c1c;font-weight:600;border-left:1px solid var(--line)}
.seg button.rst:hover{color:#ffffff;background:#dc2626}
.hd .sp{flex:1}
.hd .meta{font-size:11.5px;color:var(--dim);text-align:right;line-height:1.6}
.hd .meta b{color:var(--sub)}
.ct{max-width:1460px;margin:0 auto;padding:16px 20px 64px;display:flex;gap:16px;align-items:flex-start}
.nav{width:196px;flex-shrink:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 0;position:sticky;top:82px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.nav a{display:flex;align-items:center;gap:9px;padding:11px 18px;min-height:40px;box-sizing:border-box;font-size:13px;color:var(--sub);cursor:pointer;text-decoration:none;border-left:3px solid transparent;transition:.15s}
.nav a:hover{color:var(--tx);background:#f8fafc}
.nav a.on{color:var(--main-d);border-left-color:var(--main);background:rgba(8,145,178,.07);font-weight:600}
.nav .nl{font-size:10px;color:var(--dim);margin-left:auto;background:#eef2f7;padding:2px 7px;border-radius:99px}
.main{flex:1;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.card h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .tip{font-size:11px;color:var(--dim);font-weight:400;margin-left:8px}
.sqwrap{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.sqc{border:2px solid var(--line);border-radius:14px;padding:16px 20px 18px;background:var(--card);cursor:pointer;transition:.18s;position:relative}
.sqc:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(15,23,42,.1);border-color:#cbd5e1}
.sqc.on{border-color:var(--main);background:linear-gradient(180deg,rgba(8,145,178,.07),#fff 70%);box-shadow:0 8px 22px rgba(8,145,178,.16)}
.sqc.on:before{content:'';position:absolute;top:-2px;left:0;right:0;height:4px;background:var(--main);border-radius:14px 14px 0 0}
.sqcn{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--tx)}
.sqcb{font-size:10px;color:#fff;background:var(--main);padding:2px 9px;border-radius:99px;font-weight:500}
.sqcm{margin-top:12px;display:flex;align-items:baseline;gap:7px}
.sqcm b{font-size:32px;font-weight:800;color:var(--tx);line-height:1}
.sqcm span{font-size:12px;color:var(--sub)}
.sqcs{margin-top:7px;font-size:11.5px;color:var(--dim)}
.sec-t{font-size:17px;font-weight:700;margin:4px 0 12px;display:flex;align-items:center;gap:10px;color:#0f172a}
.sec-t .sub{font-size:11.5px;color:var(--dim);font-weight:400}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.stat .n{font-size:26px;font-weight:800;letter-spacing:.5px}
.stat .l{font-size:11.5px;color:var(--sub);margin-top:5px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{padding:9px 10px;text-align:left;font-weight:600;color:var(--dim);border-bottom:1px solid var(--line);white-space:nowrap;font-size:11.5px;background:#f8fafc}
td{padding:10px;border-bottom:1px solid #eef2f7;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f8fafc}
.tag{display:inline-block;padding:2.5px 9px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.tag.g{background:rgba(5,150,105,.12);color:#047857}
.tag.y{background:rgba(217,119,6,.12);color:#b45309}
.tag.r{background:rgba(220,38,38,.1);color:#b91c1c}
.tag.b{background:rgba(37,99,235,.1);color:#1d4ed8}
.tag.p{background:rgba(124,58,237,.1);color:#6d28d9}
.tag.o{background:rgba(234,88,12,.12);color:#c2410c}
.tag.cy{background:rgba(8,145,178,.12);color:#0e7490}
.tag.gr{background:#eef2f7;color:#64748b}
.tag.gold{background:rgba(180,83,9,.12);color:#b45309}
.lv{font-size:10px;font-weight:800;padding:1.5px 6px;border-radius:4px;letter-spacing:.5px}
.lv1{background:#eef2f7;color:#64748b}
.lv2{background:rgba(124,58,237,.12);color:#6d28d9}
.lv3{background:rgba(5,150,105,.12);color:#047857}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:none;cursor:pointer;font-size:12.5px;font-family:inherit;transition:.15s}
.btn:hover{filter:brightness(1.08)}
.btn.p{background:var(--main);color:#ffffff;font-weight:700}
.btn.g{background:var(--g);color:#ffffff;font-weight:700}
.btn.r{background:var(--r);color:#ffffff;font-weight:700}
.btn.o{background:#ffffff;border:1px solid #cbd5e1;color:var(--sub)}
.btn.o:hover{color:var(--tx);border-color:#94a3b8}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:11.5px}
.actbox{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.actrsn{font-size:10px;color:var(--dim);line-height:1.5;max-width:200px}
.reco{display:inline-block;font-size:10px;padding:1px 7px;border-radius:8px;background:#fef3c7;color:#92400e;font-weight:700;margin-right:4px}
.rsin{width:100%;min-width:130px;max-width:190px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;font-size:11px;background:var(--card2)}
.rsin:focus{outline:none;border-color:var(--main)}
.steps{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.step{width:22px;height:22px;border-radius:50%;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;background:#eef2f7;color:var(--dim);border:1px solid var(--line)}
.step.done{background:rgba(5,150,105,.12);color:#047857;border-color:rgba(5,150,105,.4)}
.step.on{background:var(--main);color:#ffffff;border-color:var(--main)}
.step.rej{background:rgba(220,38,38,.12);color:#b91c1c;border-color:rgba(220,38,38,.4)}
.sl{width:14px;height:2px;background:#cbd5e1;border-radius:2px}
.sl.done{background:rgba(5,150,105,.5)}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 12px;background:#ffffff;border:1px solid #cbd5e1;border-radius:8px;color:var(--tx);font-size:13px;font-family:inherit;outline:none;transition:.15s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--main);box-shadow:0 0 0 3px rgba(8,145,178,.12)}
.fld textarea{resize:vertical;min-height:60px}
.gate{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:9px;background:var(--card2)}
.gate .gi{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.gate.pass .gi{background:rgba(5,150,105,.12);color:#047857}
.gate.warn .gi{background:rgba(217,119,6,.12);color:#b45309}
.gate.fail .gi{background:rgba(220,38,38,.12);color:#b91c1c}
.gate.na .gi{background:#eef2f7;color:var(--dim)}
.gate .gt{flex:1}
.gate .gt b{font-size:13px;display:flex;align-items:center;gap:8px}
.gate .gt p{font-size:11.5px;color:var(--sub);margin-top:4px;line-height:1.6}
.gate .gt .basis{font-size:10.5px;color:var(--dim);margin-top:3px}
.layer{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--card2)}
.layer h4{font-size:13.5px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.layer p{font-size:12px;color:var(--sub);line-height:1.7}
.layer .list{margin-top:10px;font-size:11.5px;color:var(--sub);line-height:2}
.notice{padding:10px 14px;border-radius:9px;font-size:12px;margin-bottom:14px;line-height:1.7}
.notice.b{background:rgba(37,99,235,.07);border:1px solid rgba(37,99,235,.25);color:#1e40af}
.notice.cy{background:rgba(8,145,178,.07);border:1px solid rgba(8,145,178,.25);color:#155e75}
.notice.g{background:rgba(5,150,105,.07);border:1px solid rgba(5,150,105,.25);color:#065f46}
.notice.y{background:rgba(217,119,6,.08);border:1px solid rgba(217,119,6,.25);color:#92400e}
.notice.r{background:rgba(220,38,38,.06);border:1px solid rgba(220,38,38,.22);color:#991b1b}
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:#ffffff;border:1px solid rgba(8,145,178,.5);color:#0e7490;padding:11px 22px;border-radius:10px;font-size:13px;z-index:999;opacity:0;transition:.3s;pointer-events:none;box-shadow:0 8px 24px rgba(15,23,42,.18)}
.toast.show{opacity:1}
.ft{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:40}
.ft-in{max-width:1460px;margin:0 auto;padding:9px 20px;display:flex;align-items:center;gap:18px;font-size:11.5px;color:var(--dim);flex-wrap:wrap}
.ft-in b{color:var(--sub)}
.ft-in .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px}
.funnel{display:flex;align-items:center;gap:3px;margin:10px 0 4px}
.fun{flex:1;text-align:center;padding:7px 4px;border-radius:6px;font-size:10.5px;font-weight:700;letter-spacing:.5px}
.fun.l1{background:rgba(8,145,178,.12);color:#0e7490}
.fun.l2{background:rgba(37,99,235,.1);color:#1d4ed8}
.fun.l3{background:rgba(5,150,105,.12);color:#047857}
.fun.l4{background:rgba(217,119,6,.12);color:#b45309}
.fun.l5{background:rgba(124,58,237,.1);color:#6d28d9}
.fun.l6{background:rgba(234,88,12,.12);color:#c2410c}
.fa{color:var(--dim);font-size:11px}
.bar{height:6px;border-radius:3px;background:#eef2f7;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;border-radius:3px}
.mono{font-family:Consolas,monospace;font-size:11px;color:var(--dim)}
.star{color:#f59e0b;letter-spacing:1px}
.tline{border-left:2px solid #e2e8f0;padding-left:14px;margin-left:6px}
.tline .ev{position:relative;padding:7px 0}
.tline .ev:before{content:'';position:absolute;left:-21px;top:11px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--main)}
.tline .ev.plus:before{border-color:var(--g);background:rgba(5,150,105,.15)}
.tline .ev.minus:before{border-color:var(--r);background:rgba(220,38,38,.12)}
.tline .ev .d{font-size:10.5px;color:var(--dim)}
.tline .ev .t{font-size:12px;color:var(--sub)}
.chartlite{display:flex;align-items:flex-end;gap:8px;height:64px;padding-top:8px}
.chartlite .c{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.chartlite .c i{width:16px;border-radius:3px 3px 0 0;background:linear-gradient(180deg,#22d3ee,#0891b2);min-height:2px;display:block}
.chartlite .c span{font-size:9.5px;color:var(--dim)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.pulse{animation:pulse 1s infinite}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(5,150,105,.45)}100%{box-shadow:0 0 0 14px rgba(5,150,105,0)}}
.flash{animation:flash .8s ease-out}
@keyframes flashr{0%{box-shadow:0 0 0 0 rgba(220,38,38,.45)}100%{box-shadow:0 0 0 14px rgba(220,38,38,0)}}
.flashr{animation:flashr .8s ease-out}
.prog{height:8px;border-radius:4px;background:#eef2f7;overflow:hidden;margin:0 0 14px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#06b6d4,#0891b2);border-radius:4px;transition:width .6s ease}
.upzone{border:2px dashed #cbd5e1;border-radius:10px;padding:20px;text-align:center;color:var(--dim);cursor:pointer;transition:.15s;background:#f8fafc;font-size:12px}
.upzone:hover{border-color:var(--main);color:var(--main)}
.upzone.dragover{border-color:var(--main);background:rgba(8,145,178,.05)}
.flist{margin-top:8px}
.flist .fi{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--card2);border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:12px}
.flist .fi .nm{flex:1}
.srcwrap{margin-top:2px}
.src{display:flex;gap:6px;padding:3px 0;font-size:11.5px;color:var(--sub);align-items:center}
.srcp{color:#047857}
.srcf{color:#b91c1c}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:99;padding:16px}
.actw{background:#fff;border-radius:12px;box-shadow:0 12px 44px rgba(15,23,42,.28);width:440px;max-width:94vw;padding:20px}
.actw h4{margin:0 0 4px;font-size:15px}
.actw .asub{font-size:11.5px;color:var(--sub);margin-bottom:12px;line-height:1.7}
.actw textarea{width:100%;min-height:74px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:12.5px;font-family:inherit;resize:vertical;box-sizing:border-box}
#acNote{width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:8px;padding:9px 11px;font-size:12.5px;font-family:inherit;resize:vertical;min-height:84px;color:var(--tx);outline:none;background:#fff}
#cfNote{width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:8px;padding:9px 11px;font-size:12.5px;font-family:inherit;resize:vertical;min-height:74px;color:var(--tx);outline:none;background:#fff}
.actw textarea:focus{outline:none;border-color:var(--main)}
.actw .abtn{margin-top:12px;display:flex;gap:8px;justify-content:flex-end}
.detw{background:#fff;border-radius:12px;box-shadow:0 12px 44px rgba(15,23,42,.28);width:600px;max-width:94vw;max-height:88vh;overflow-y:auto;padding:20px}
.detw h4{margin:0 0 4px;font-size:15px}
.detw .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:10px 0}
.detw .drow{font-size:12px;color:var(--sub)}
.detw .drow b{color:var(--tx)}
.detw .dsec{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.detw .dsec h5{margin:0 0 8px;font-size:12.5px;color:var(--tx)}
.detw .list{font-size:12px;color:var(--sub);line-height:1.9}
.detw .list b{color:var(--tx)}

.avc-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.avc{display:grid;grid-template-columns:20px 1fr auto;grid-template-rows:auto auto;align-items:center;gap:1px 7px;padding:9px 11px 9px 9px;border:1.5px solid var(--line);border-left:4px solid var(--vc,#cbd5e1);border-radius:10px;cursor:pointer;transition:.13s;background:#fff;position:relative;overflow:hidden}
.avc:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(15,23,42,.07);border-top-color:#94a3b8;border-right-color:#94a3b8;border-bottom-color:#94a3b8}
.avc.on{border-color:var(--g);border-left-color:var(--g);background:linear-gradient(135deg,rgba(16,185,129,.07),#fff 55%);box-shadow:0 3px 10px rgba(16,185,129,.15)}
.avc.dis{opacity:.38;cursor:not-allowed;pointer-events:none}
.avc-chk{grid-row:1/3;width:18px;height:18px;border:2px solid #cbd5e1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:transparent;transition:.13s;justify-self:center}
.avc.on .avc-chk{background:var(--g);border-color:var(--g);color:#fff}
.avc-main{display:flex;align-items:center;gap:6px;min-width:0}
.avc-name{font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avc-badge{font-size:9.5px;padding:1px 6px;border-radius:99px;white-space:nowrap}
.avc-badge.gold{color:#b45309;background:rgba(245,158,11,.15)}
.avc-badge.green{color:#047857;background:rgba(16,185,129,.13)}
.avc-badge.red{color:#b91c1c;background:rgba(220,38,38,.11)}
.avc-sub{font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avc-score{grid-row:1/3;grid-column:3;font-weight:800;font-size:15px;justify-self:end}

.mkt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mkt-card{border:1.5px solid var(--line);border-radius:12px;padding:14px 15px;background:#fff;transition:.15s;border-top:3px solid var(--main)}
.mkt-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(15,23,42,.09)}
.mkt-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.mkt-xq{font-size:11px;color:var(--sub);background:var(--card2);padding:2px 8px;border-radius:99px}
.mkt-id{font-size:10px;color:var(--dim)}
.mkt-item{font-size:14px;font-weight:700;margin-bottom:10px;line-height:1.4}
.mkt-row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--sub);padding:3px 0}
.mkt-row b{color:var(--main);font-size:15px}
.empty{text-align:center;padding:44px 0;color:var(--dim);font-size:13px}

.perf-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.pf-card{border:1.5px dashed #cbd5e1;border-radius:10px;padding:12px 13px;cursor:pointer;transition:.13s;background:#fff;position:relative}
.pf-card:hover{border-color:var(--main);background:rgba(6,182,212,.04);transform:translateY(-1px)}
.pf-card.req{border-style:solid;border-color:#fbbf24;background:linear-gradient(180deg,rgba(251,191,36,.05),#fff)}
.pf-ic{font-size:20px;margin-bottom:5px}
.pf-ttl{font-size:13px;font-weight:700;margin-bottom:3px}
.pf-req{font-size:9.5px;color:#b45309;background:rgba(245,158,11,.15);padding:1px 6px;border-radius:99px;vertical-align:1px}
.pf-opt{font-size:9.5px;color:var(--dim);background:var(--card2);padding:1px 6px;border-radius:99px;vertical-align:1px}
.pf-desc{font-size:10.5px;color:var(--dim);margin-bottom:6px;line-height:1.5}
.pf-count{font-size:10.5px;color:var(--main);font-weight:700}
.pf-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.pf-chip{font-size:12px;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:3px 10px;color:var(--sub);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.qlist{display:flex;flex-direction:column;gap:9px}

function thAddImgs(fl){
 var files=[];try{files=Array.prototype.slice.call(fl)}catch(e){}
 files.forEach(function(f){
  if(THRESH_IMGS.length>=3){toast('最多上传 3 张凭证图片');return}
  if(f.size>2*1024*1024){toast('图片过大（限 2MB）：'+f.name);return}
  var rd=new FileReader();
  rd.onload=function(ev){
   var img=new Image();
   img.onload=function(){
    var cv=document.createElement('canvas');
    var W=400;var sc=W/img.width;cv.width=W;cv.height=Math.round(img.height*sc);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    THRESH_IMGS.push({name:f.name,data:cv.toDataURL('image/jpeg',0.78)});
    thRefreshGrid();
   };
   img.src=ev.target.result;
  };
  rd.readAsDataURL(f);
 });
}

function layerRow(a,idx){

function setLayer(a,idx,st){
 a.fun[idx]=st;
 var row=document.getElementById('rvL'+idx);if(row)row.outerHTML=layerRow(a,idx);

 if(st===1){if(nr)nr.classList.add('flash')}else if(st===-1){if(nr)nr.classList.add('flashr')}

function applyTick(a){
 a.tick++;
 var t=a.tick;
 if(!a.bad){
  if(t===1)setSrc(a,0,2)
  else if(t===2){setSrc(a,0,1,'A级');setSrc(a,1,2)}
  else if(t===3){setSrc(a,1,1,'正常缴纳');setSrc(a,2,2)}
  else if(t===4){setSrc(a,2,1,'无环保/安全类');setSrc(a,3,2)}
  else if(t===5){setSrc(a,3,1,'不在列');setLayer(a,2,1)}
  else if(t===6)setLayer(a,3,2)
  else if(t===7)setLayer(a,3,1)
  else if(t===8)setLayer(a,4,2)
  else if(t===9)setLayer(a,4,1)
  else if(t===10)setLayer(a,5,2)
  else if(t===11){setLayer(a,5,1);finishReview(a,true)}
 }else{
  if(t===1)setSrc(a,0,2)
  else if(t===2){setSrc(a,0,-1,'C级 ✕');setSrc(a,1,2)}
  else if(t===3){setSrc(a,1,1,'正常缴纳');setSrc(a,2,2)}
  else if(t===4){setSrc(a,2,1,'无环保/安全类');setSrc(a,3,2)}
  else if(t===5){setSrc(a,3,1,'不在列');setLayer(a,2,-1);finishReview(a,false)}
 }
}

   h+='<tr><td>'+a.xq+'</td><td class="mono">'+a.t+'</td><td><span class="tag '+st[0]+'">'+st[1]+'</span></td>'+
   '<td style="font-size:11.5px;color:var(--sub)">'+last[0]+' '+last[2]+'：'+last[1]+'</td></tr>';
  });
  h+='</table></div>';
 }
 h+='<div class="notice cy">🏬 <b>入驻规则</b>：平台审核由近场供应链端执行（六层漏斗），通过后才有资格申请入驻小区；入驻需小区采购方/业委会确认（常规路径：物业推荐→业委会审批；业委会也可直审）。信用档案全程跟随——入驻后的履约表现持续更新信用。</div>';
 return h;
}
function sjApplyT2(){
 var xq=document.getElementById('sjNewXq');if(!xq||!xq.value){toast('暂无可申请的新小区');return}
 var q=xq.value;
 if(T2_APPS.some(function(a){return a.name===SJ.name&&a.xq===q&&a.ywAppr!==1&&a.ywAppr!==0&&a.mRec!==0})){toast('已有该小区的在途申请 · 请勿重复提交');return}
 T2_APPS.unshift({id:'T2A'+('0'+(4+T2_APPS.length)),name:SJ.name,type:SJ.type,xq:q,funnel:'六层漏斗全通过',score:SJ.score,
  mRec:null,mBy:'',mNote:'',mT:'',ywAppr:null,yBy:'',yNote:'',yT:'',t:'2026-09-09',
  logs:[['2026-09-09','商家提交入驻小区申请 · 六层漏斗已全部通过（已入驻平台）',SJ.name]]});
 toast('入驻申请已提交 → 审批进度见本页「我的入驻申请」，通过后自动入池');
 render();
}
function detail(id){
 var o=orders().filter(function(x){return x.id===id})[0];if(!o)return;
 window._busyDetail=true;
 var h='<div class="card" style="border-color:rgba(6,182,212,.4)"><h3>采购详情 <span class="mono">'+o.id+'</span> <span style="margin-left:auto;cursor:pointer" onclick="render()">✕ 关闭</span></h3>'+
 '<div class="g4"><div class="stat"><div class="n" style="font-size:18px">'+o.item+'</div><div class="l">品目</div></div>'+
 '<div class="stat"><div class="n" style="font-size:18px;color:var(--main)">'+money(o.amt)+'</div><div class="l">金额</div></div>'+
 '<div class="stat"><div class="n" style="font-size:18px">'+ltag(o.layer)+'</div><div class="l">透明层级</div></div>'+
 '<div class="stat"><div class="n" style="font-size:18px">'+stag(o.status)+'</div><div class="l">状态</div></div></div>';
 var actTip='';
 if(ROLE==='yw'&&o.status==='待审批')actTip='当前可操作：<b>审批</b>——依据五道闸结果 + 比价留痕 + 金额(依合同约定)决定批准或驳回，驳回须填理由留痕。';
 else if(ROLE==='yw'&&o.status==='待定标')actTip='当前可操作：<b>定标确认</b>——确认比价选定结果，进入合同签订；选定理由将随公示推送业主端。';
 else if(ROLE==='sq'&&o.status==='已验收'&&o.layer===3)actTip='当前可操作：<b>备案接收</b>——大额采购备案即公示，社区端存档可查。';
 else if(ROLE==='wy'&&o.status==='待定标')actTip='等待业委会<b>定标确认</b>——定标后进入合同签订与履约；履约完成后由物业申报验收。';
 if(actTip){
  h+='<div class="notice cy">🎯 '+actTip+'</div>';
  h+='<div class="actbox" style="margin-bottom:14px">';
  if(ROLE==='yw'&&o.status==='待审批'){h+='<input class="rsin" id="dapv_'+o.id+'" placeholder="审批意见（驳回必填·留痕）"><button class="btn g" onclick="approveOK(\''+o.id+'\')">批准</button><button class="btn r" onclick="approveNo(\''+o.id+'\')">驳回</button><span class="actrsn">批准 → 进入比价环节 ｜ 驳回 → 退回物业修改（意见留痕可追溯）</span>';}
  else if(ROLE==='yw'&&o.status==='待定标'){h+='<button class="btn g" onclick="doAct(\''+o.id+'\',\'定标确认\')">定标确认</button><span class="actrsn">确认比价选定 → 进入合同签订（理由随公示）</span>';}
  else if(ROLE==='sq'&&o.status==='已验收'&&o.layer===3){h+='<button class="btn g" onclick="doAct(\''+o.id+'\',\'备案接收\')">备案接收</button><span class="actrsn">大额采购 · 备案即公示 · 社区存档可查</span>';}
  h+='</div>';
 }
 h+='<h3 style="margin-top:4px">五道闸结果</h3>';
 o.gates.forEach(function(g){
  var st=g[1]===1?'pass':g[1]===-1?'fail':'na';var ic=st==='pass'?'✓':st==='fail'?'✕':'—';
  h+='<div class="gate '+st+'"><div class="gi">'+ic+'</div><div class="gt"><b>'+g[0]+'</b><p>'+g[2]+'</p></div></div>';
 });
 if(o.status==='比价中'&&QUOTES[id]){
  h+='<h3 style="margin-top:14px">比价进行中</h3><table><tr><th>供应商</th><th>报价</th><th>信用分</th></tr>';
  QUOTES[id].forEach(function(q){h+='<tr><td>'+q.name+'</td><td>'+money(q.price)+'</td><td>'+q.score+'</td></tr>'});
  h+='</table>';
 }
 if(o.reason)h+='<div class="notice b">📌 选择理由：'+o.reason+'</div>';
 if(o.files&&o.files.length)h+='<div class="notice cy">📎 需求附件（'+o.files.length+'个）：'+o.files.map(function(f){return '📄 '+f}).join('　')+'</div>';
 if(o.status==='已拦截')h+='<div class="notice r">✕ 拦截原因：拆单闸检测到疑似拆分采购。请与关联采购单合并申报。</div>';
 h+='</div>';
 document.getElementById('main').innerHTML=h;
}
function render(){
 stopReviewTimer();
 window._busyDetail=false;
 var f;
 if(ROLE==='sj'){
  if(!SJ_LOGIN){f={gate:vSjGate,apply:vSjApply,review:vSjReview}[TAB]||vSjGate;}
  else{f={work:vSjWork,market:vSjMarket,sjquote:vSjQuote,perf:vSjPerf,settle:vSjSettle,goods:vGoods,credit:vSjCredit,status:vSjStatus}[TAB];}
 }
 else{f={over:vOver,apply:vApply,quote:vQuote,approve:vApprove,contract:vContract,accept:vAccept,publicity:vPublicity,vendor:vVendor,goods:vGoods,onbrd:vOnbrd,thresh:vThresh}[TAB];}
 document.getElementById('commLbl').textContent=ROLE==='sq'?'全街道监督':comm();
 var body=f();
 if(ROLE==='sq'&&TAB!=='apply')body=sqBar(TAB)+body;
 document.getElementById('main').innerHTML=body;
 saveState();
}
loadState();setRole(ROLE);buildNav();render();
</script>
