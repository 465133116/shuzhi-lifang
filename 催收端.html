<style>*{margin:0;padding:0;box-sizing:border-box}:root{--p:#2563eb;--d:#dc2626;--s:#16a34a;--w:#f59e0b;--bg:#f1f5f9;--c:#fff;--t:#1e293b;--sub:#64748b;--b:#e2e8f0;--r:10px}body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--t);min-height:100vh}.tn{background:#1e293b;color:#fff;display:flex;align-items:center;padding:0 20px;height:52px;gap:12px}.tn span{font-weight:700;font-size:15px}.tn .info{font-size:11px;opacity:0.7;margin-left:auto}.ct{max-width:1500px;margin:0 auto;padding:16px}.flex{display:flex;gap:16px}.side{width:200px;background:var(--c);border-radius:var(--r);padding:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.08);flex-shrink:0}.side a{display:block;padding:10px 20px;font-size:13px;color:var(--t);text-decoration:none;cursor:pointer;border-left:3px solid transparent;transition:.15s}.side a:hover,.side a.on{background:#eff6ff;color:var(--p);border-left-color:var(--p);font-weight:600}.side .sec{font-size:10px;color:var(--sub);padding:16px 20px 6px;text-transform:uppercase;letter-spacing:1px}.side .badge{float:right;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:var(--d);color:#fff;font-size:10px;text-align:center;margin-top:1px}.main{flex:1;min-width:0}.card{background:var(--c);border-radius:var(--r);padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:12px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}.g6{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.stat{text-align:center;padding:10px}.stat .n{font-size:20px;font-weight:700}.stat .l{font-size:10px;color:var(--sub);margin-top:2px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--b)}th{background:#f8fafc;font-weight:600;color:var(--sub);font-size:11px}.tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:500}.tag-r{background:#fef2f2;color:var(--d)}.tag-g{background:#f0fdf4;color:var(--s)}.tag-y{background:#fffbeb;color:var(--w)}.tag-b{background:#eff6ff;color:var(--p)}.tag-gr{background:#f8fafc;color:var(--sub)}.tag-p{background:#f3e8ff;color:#9333ea}.btn{display:inline-block;padding:6px 14px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:500;transition:.15s}.btn:hover{opacity:.85}.btn-p{background:var(--p);color:#fff}.btn-d{background:var(--d);color:#fff}.btn-s{background:var(--s);color:#fff}.btn-o{background:transparent;border:1px solid var(--b);color:var(--t)}.btn-s2{padding:4px 10px;font-size:11px}.btn-bl{display:block;width:100%;text-align:center;padding:12px;font-size:15px}.mo{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200}.md{background:#fff;border-radius:var(--r);padding:24px;max-width:650px;width:90%;max-height:80vh;overflow-y:auto}.tb{display:flex;border-bottom:2px solid var(--b);margin-bottom:12px;flex-wrap:wrap}.tb button{padding:8px 16px;border:none;background:none;cursor:pointer;font-size:12px;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-2px}.tb button.on{color:var(--p);border-bottom-color:var(--p);font-weight:600}.bar{height:4px;background:#e2e8f0;border-radius:2px;overflow:hidden;margin-top:3px}.bar>div{height:100%;border-radius:2px}input,select,textarea{width:100%;padding:8px 12px;border:1px solid var(--b);border-radius:6px;font-size:13px;font-family:inherit;margin-bottom:8px}label{display:block;font-size:12px;font-weight:600;color:var(--sub);margin-bottom:3px}.h{display:none!important}</style></head>
<body><div class="tn"><span>数治理方 · 催收端</span><span class="info">催收中心</span></div>
<div class="ct"><div class="flex">
<div class="side">

<script>var D={pj:[{id:'p1',n:'阳光花园-在管',sid:'s1',tk:'在管',cl:'c1'},{id:'p2',n:'翠苑新村-退管',sid:'s2',tk:'退管',cl:'c3'},{id:'p3',n:'翠苑新村-在管',sid:'s2',tk:'在管',cl:'c2'},{id:'p4',n:'锦绣家园-在管',sid:'s3',tk:'在管',cl:'c2'}],cl:[{id:'c1',n:'张经理',calls:25,rec:12800,a:true},{id:'c2',n:'李催员',calls:18,rec:9500,a:true},{id:'c3',n:'王组长',calls:32,rec:21500,a:true}],s:[{id:'s1',n:'阳光花园',tp:'B',mg:'在管',m:'张经理'},{id:'s2',n:'翠苑新村',tp:'A',mg:'已更替',m:'李经理'},{id:'s3',n:'锦绣家园',tp:'B',mg:'在管',m:'王经理'}],o:[{id:1,n:'张建国',r:'3-1502',p:'13800001111',sid:'s1',pid:'p1',tp:'A',cr:'B',it:'中',tk:'在管',ct:3600,nd:2,st:'ip',cl:'c1',lb:'',pd:0},{id:2,n:'李芳',r:'5-801',p:'13800002222',sid:'s1',pid:'p1',tp:'B',cr:'C',it:'高',tk:'在管',ct:1800,nd:1,st:'cl',cl:'c1',lb:'',pd:0},{id:3,n:'周大明',r:'3-502',p:'13900001111',sid:'s1',pid:'p1',tp:'E',cr:'D',it:'低',tk:'退管',ct:12000,nd:4,st:'ip',cl:'c3',lb:'前物业遗留',pd:0},{id:9,n:'孙丽',r:'6-502',p:'13800007777',sid:'s2',pid:'p2',tp:'A',cr:'B',it:'中',tk:'退管',ct:2400,nd:3,st:'pa',cl:'c3',lb:'',pd:0},{id:6,n:'赵大伟',r:'2-1101',p:'13800006666',sid:'s2',pid:'p3',tp:'C',cr:'B',it:'高',tk:'在管',ct:4800,nd:1,st:'cl',cl:'c2',lb:'',pd:0},{id:8,n:'周末',r:'1-303',p:'13800008888',sid:'s3',pid:'p4',tp:'D',cr:'E',it:'拒绝',tk:'在管',ct:6000,nd:1,st:'cl',cl:'c2',lb:'',pd:0},{id:10,n:'吴小丽',r:'1-1101',p:'13801001111',sid:'s1',pid:'p1',tp:'A',cr:'A',it:'高',tk:'在管',ct:900,nd:1,st:'cl',cl:'c1',lb:'',pd:0},{id:11,n:'郑国强',r:'6-301',p:'13900003333',sid:'s2',pid:'p3',tp:'C',cr:'B',it:'中',tk:'在管',ct:3200,nd:2,st:'ip',cl:'c3',lb:'承诺月底',pd:1500}],lg:[],nx:100};window._cf={tp:'all',tk:'all',cl:'all'};
function ft(n){return n.toLocaleString()}
function tt(t){var m={A:'A争议',B:'B困难',C:'C观望',D:'D失约',E:'E对抗'};return m[t]||t}
function tpCls(t){return t==='A'?'tag-y':t==='B'?'tag-g':t==='C'?'tag-b':t==='D'?'tag-r':'tag-p'}
function st(t){document.querySelectorAll('.side a').forEach(function(a){a.classList.remove('on')});document.getElementById('st-'+t).classList.add('on');var m={projects:sp,tasks:stk,sms:ssms,verify:sv,flexible:sf,rigid:srg,installment:si,assign:sas,disputes:sd,credit:sc,staff:ss};if(m[t])m[t]()}
function flt(oo){return oo.filter(function(o){var f=window._cf;if(f.tp!=='all'&&o.tp!==f.tp)return false;if(f.tk!=='all'&&o.tk!==f.tk)return false;if(f.cl!=='all'&&o.cl!==f.cl)return false;return true})}
function ndBar(n){var s='';for(var i=1;i<=7;i++){var bg=i<=n?(i>=4?'#fef2f2':'#f0fdf4'):'#f8fafc';s+='<span style="display:inline-block;width:17px;height:15px;line-height:15px;text-align:center;font-size:8px;border-radius:2px;background:'+bg+';margin:1px">'+i+'</span>'}return s}
function sp(){var h='<div class="g4" style="margin-bottom:16px"><div class="card stat"><div class="n">'+D.pj.length+'</div><div class="l">总项目</div></div><div class="card stat"><div class="n">'+D.o.length+'</div><div class="l">总户数</div></div><div class="card stat"><div class="n" style="color:var(--p)">¥'+ft(D.o.reduce(function(s,x){return s+x.ct-x.pd},0))+'</div><div class="l">待收(扣除已回款)</div></div><div class="card stat"><div class="n" style="color:var(--s)">¥'+ft(D.o.reduce(function(s,x){return s+x.pd},0))+'</div><div class="l">已回款</div></div></div><h2>项目总览</h2><div class="g3">';D.pj.forEach(function(p){var oo=D.o.filter(function(x){return x.pid===p.id});var ta=oo.reduce(function(s,x){return s+x.ct-x.pd},0);var s=D.s.find(function(x){return x.id===p.sid});var cl=D.cl.find(function(x){return x.id===p.cl});h+='<div class="card" data-action="enter" data-pid="'+p.id+'" style="cursor:pointer"><div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:8px"><div><div style="font-size:16px;font-weight:700">'+p.n+'</div><div style="font-size:11px;color:var(--sub)">'+(s?s.n:'')+' | '+(cl?cl.n:'')+'</div></div><span class="tag '+(p.tk==='退管'?'tag-y':'tag-g')+'">'+p.tk+'</span></div><div class="g2"><div style="background:#f8fafc;padding:6px;border-radius:6px;text-align:center"><div style="font-size:14px;font-weight:700">'+oo.length+'</div><div style="font-size:9px;color:var(--sub)">户数</div></div><div style="background:#f8fafc;padding:6px;border-radius:6px;text-align:center"><div style="font-size:14px;font-weight:700">¥'+ft(ta)+'</div><div style="font-size:9px;color:var(--sub)">待收</div></div></div></div>'});h+='</div>';document.getElementById('main').innerHTML=h}
function stk(){var pid=window._cs;var oo=pid?D.o.filter(function(x){return x.pid===pid}):D.o;if(pid)oo=flt(oo);var h='';if(pid){var p=D.pj.find(function(x){return x.id===pid});h+='<button class="btn btn-o" onclick="window._cs=null;st(\'projects\')" style="margin-bottom:12px">← 返回项目</button><div style="font-size:18px;font-weight:700;margin-bottom:12px">'+p.n+'</div>'}h+='<div class="card" style="margin-bottom:8px;padding:8px 12px"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span style="font-size:11px;font-weight:600;color:var(--sub)">筛选:</span><select onchange="window._cf.tp=this.value;st(\'tasks\')" style="width:auto;margin:0"><option value="all">全部类型</option><option value="A">A争议</option><option value="B">B困难</option><option value="C">C观望</option><option value="D">D失约</option><option value="E">E对抗</option></select><select onchange="window._cf.tk=this.value;st(\'tasks\')" style="width:auto;margin:0"><option value="all">全部轨</option><option value="在管">在管轨</option><option value="退管">退管轨</option></select><select onchange="window._cf.cl=this.value;st(\'tasks\')" style="width:auto;margin:0"><option value="all">全部催收员</option>'+D.cl.map(function(c){return'<option value="'+c.id+'">'+c.n+'</option>'}).join('')+'</select></div></div><div class="card"><table><tr><th>业主</th><th>类型</th><th>信用</th><th>意向</th><th>轨</th><th>金额</th><th>已回款</th><th>待收</th><th>进度</th><th>催收员</th><th>操作</th></tr>';oo.forEach(function(o){var cl=D.cl.find(function(x){return x.id===o.cl});h+='<tr><td>'+o.n+'<br><span style="font-size:10px;color:var(--sub)">'+o.r+'</span></td><td><span class="tag '+tpCls(o.tp)+'">'+tt(o.tp)+'</span></td><td>'+o.cr+'</td><td>'+o.it+'</td><td><span class="tag '+(o.tk==='退管'?'tag-y':'tag-g')+'">'+o.tk+'</span></td><td>¥'+ft(o.ct)+'</td><td style="color:var(--s)">'+(o.pd>0?'¥'+ft(o.pd):'-')+'</td><td style="color:var(--d)">¥'+ft(o.ct-o.pd)+'</td><td>'+ndBar(o.nd)+'</td><td>'+(cl?cl.n:'未分')+'</td><td><button class="btn btn-p btn-s2" onclick="co('+o.id+')">外呼</button> <button class="btn btn-s btn-s2" onclick="spay('+o.id+')">回款</button> <button class="btn btn-o btn-s2" onclick="av('+o.id+')">推进</button></td></tr>'});h+='</table></div>';document.getElementById('main').innerHTML=h}
function spay(id){var o=D.o.find(function(x){return x.id===id});var h='<div class="mo" onclick="if(event.target===this)this.remove()"><div class="md"><h3>回款登记 - '+o.n+'('+o.r+')</h3><div style="margin:12px 0;font-size:12px">总欠费: ¥'+ft(o.ct)+' | 已回: ¥'+ft(o.pd)+' | 待收: ¥'+ft(o.ct-o.pd)+'</div><label>回款金额</label><input type="number" id="payAmt" placeholder="输入回款金额"><label>备注</label><textarea id="payNt"></textarea><div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-s btn-bl" onclick="cpay('+o.id+')">确认回款</button><button class="btn btn-o btn-bl" onclick="this.closest(\'.mo\').remove()">取消</button></div></div></div>';document.getElementById('main').insertAdjacentHTML('beforeend',h)}
function cpay(id){var o=D.o.find(function(x){return x.id===id});var amt=parseInt(document.getElementById('payAmt').value)||0;if(amt<=0){alert('请输入有效金额');return}o.pd+=amt;o.lb=document.getElementById('payNt').value;D.lg.push({id:id,t:new Date().toISOString(),act:'回款',rs:'¥'+ft(amt),nt:o.lb});if(o.pd>=o.ct){o.st='done';alert('欠费已结清！')}document.querySelectorAll('.mo').forEach(function(m){m.remove()});stk();alert('回款已登记')}
function ssms(){
var h='<h2>短信中心</h2><div class="g2"><div class="card"><h3>1.选择项目与模板</h3><div style="margin-bottom:8px"><label>目标项目</label><select id="smsPid" onchange="smsLoad()">'+D.pj.map(function(p){return'<option value="'+p.id+'">'+p.n+'</option>'}).join('')+'</select></div><label>短信模板</label><select id="smsTpl" onchange="document.getElementById("smsPreview").value=this.value"><option value="">选择模板</option><option value="【杭州个信数治】{业主}，您物业费待缴{金额}元，请尽快处理以免影响信用。http://letter.nbgx.ltd/{短码}">缴费提醒</option><option value="【杭州个信数治】{业主}，第{期数}期分期{金额}元即将到期，请按时缴纳。">分期提醒</option><option value="【杭州个信数治】{业主}，关于您反馈的费用争议，已记录并协商中，请耐心等待。">争议告知</option></select><label>短信内容(可修改)</label><textarea id="smsPreview" style="min-height:60px"></textarea></div><div class="card"><h3>2.选择目标业主</h3><div style="display:flex;gap:8px;margin-bottom:8px"><button class="btn btn-o btn-s2" onclick="smsAll()">全选</button><button class="btn btn-o btn-s2" onclick="smsNone()">取消全选</button><button class="btn btn-o btn-s2" onclick="smsInv()">反选</button></div><div id="smsList" style="max-height:300px;overflow-y:auto"></div></div></div><div class="card"><h3>3.发送</h3><div style="display:flex;gap:8px"><button class="btn btn-p btn-bl" onclick="bsms()">批量发送</button><button class="btn btn-o btn-bl" onclick="smsPreview()">预览选中</button></div></div>';
document.getElementById('main').innerHTML=h;smsLoad()}
function smsLoad(){var pid=document.getElementById('smsPid').value;var oo=D.o.filter(function(x){return x.pid===pid});var h='';oo.forEach(function(o){h+='<div style="padding:6px 8px;border-bottom:1px solid var(--b);display:flex;align-items:center;gap:8px"><input type="checkbox" class="smsCb" value="'+o.id+'" checked><span style="font-size:12px">'+o.n+'</span><span style="font-size:10px;color:var(--sub)">'+o.r+'</span><span style="font-size:10px">¥'+ft(o.ct)+'</span><span style="font-size:10px;color:var(--sub)">待收¥'+ft(o.ct-o.pd)+'</span></div>'});h+='<div style="font-size:10px;color:var(--sub);margin-top:4px">共 '+oo.length+' 户</div>';document.getElementById('smsList').innerHTML=h}
function smsAll(){document.querySelectorAll('.smsCb').forEach(function(c){c.checked=true})}
function smsNone(){document.querySelectorAll('.smsCb').forEach(function(c){c.checked=false})}
function smsInv(){document.querySelectorAll('.smsCb').forEach(function(c){c.checked=!c.checked})}
function smsPreview(){var ids=[];document.querySelectorAll('.smsCb:checked').forEach(function(c){ids.push(parseInt(c.value))});if(ids.length===0){alert('请勾选业主');return}var tpl=document.getElementById('smsPreview').value||'{业主}您好，您有物业费待缴';var h='<div class="mo" onclick="if(event.target===this)this.remove()"><div class="md"><h3>短信预览 ('+ids.length+'户)</h3>';ids.forEach(function(id){var o=D.o.find(function(x){return x.id===id});var txt=tpl.replace('{业主}',o.n).replace('{金额}',ft(o.ct)).replace('{短码}','abcd'+id).replace('{期数}','1').replace('{房号}',o.r);h+='<div style="border-bottom:1px solid var(--b);padding:6px 0;font-size:12px"><div style="color:var(--sub)">'+o.n+'('+o.r+')</div><div>'+txt+'</div></div>'});h+='<button class="btn btn-o btn-bl" style="margin-top:8px" onclick="this.closest(".mo").remove()">关闭</button></div></div>';document.getElementById('main').insertAdjacentHTML('beforeend',h)}
function bsms(){var ids=[];document.querySelectorAll('.smsCb:checked').forEach(function(c){ids.push(parseInt(c.value))});if(ids.length===0){alert('请勾选业主');return}var tpl=document.getElementById('smsPreview').value||'{业主}您好，您有物业费待缴';if(!confirm('确认向 '+ids.length+' 户发送短信？'))return;ids.forEach(function(id){var o=D.o.find(function(x){return x.id===id});var txt=tpl.replace('{业主}',o.n).replace('{金额}',ft(o.ct)).replace('{短码}','abcd'+id).replace('{期数}','1');D.lg.push({id:id,t:new Date().toISOString(),act:'短信',rs:'已发送',nt:txt.substring(0,40)})});alert('已发送 '+ids.length+' 户')}
function sas(){var h='<h2>分配管理</h2><div class="card"><h3>项目分配</h3><table><tr><th>项目</th><th>轨</th><th>当前催收员</th><th>操作</th></tr>';D.pj.forEach(function(p){var cl=D.cl.find(function(x){return x.id===p.cl});h+='<tr><td>'+p.n+'</td><td><span class="tag '+(p.tk==='退管'?'tag-y':'tag-g')+'">'+p.tk+'</span></td><td>'+(cl?cl.n:'未分配')+'</td><td><select onchange="ras(this,\''+p.id+'\')" style="width:auto;margin:0"><option value="">重新分配</option>'+D.cl.map(function(c){return'<option value="'+c.id+'">'+c.n+'</option>'}).join('')+'</select></td></tr>'});h+='</table></div><div class="card"><h3>个人分配</h3><table><tr><th>催收员</th><th>负责户</th><th>总待收</th><th>操作</th></tr>';D.cl.forEach(function(c){var co=D.o.filter(function(x){return x.cl===c.id});h+='<tr><td>'+c.n+'</td><td>'+co.length+'</td><td>¥'+ft(co.reduce(function(s,x){return s+x.ct-x.pd},0))+'</td><td><button class="btn btn-o btn-s2" onclick="alert(\'为 '+c.n+' 添加任务\')">添加任务</button> <button class="btn btn-o btn-s2" onclick="alert(\'重新分配 '+c.n+' 的任务\')">重新分配</button></td></tr>'});h+='</table></div>';document.getElementById('main').innerHTML=h}
function ras(sel,pid){var cid=sel.value;if(!cid)return;var cl=D.cl.find(function(x){return x.id===cid});var p=D.pj.find(function(x){return x.id===pid});p.cl=cid;D.o.filter(function(x){return x.pid===pid}).forEach(function(o){o.cl=cid});alert('项目 '+p.n+' 已分配给 '+cl.n);sas()}
