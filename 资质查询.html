<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>数治理方 · 资质查询</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --p:#2563eb;--pd:#1e40af;--bg:#f0f2f5;--card:#fff;--t:#1e293b;--sub:#64748b;
  --b:#e2e8f0;--g:#059669;--o:#d97706;--r:#dc2626;--gy:#94a3b8;
}
body{background:var(--bg);font-family:'PingFang SC','Microsoft YaHei',sans-serif;color:var(--t);min-height:100vh}
/* ===== 顶部 ===== */
.top{background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 100%);color:#fff;padding:30px 20px 64px}
.top-in{max-width:920px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:19px}
.brand .nm{font-size:20px;font-weight:700;letter-spacing:1px}
.brand .tag{font-size:11px;background:rgba(255,255,255,.18);padding:3px 10px;border-radius:20px;margin-left:6px;letter-spacing:2px}
.brand .slogan{font-size:12px;color:rgba(255,255,255,.75);margin-top:6px;padding-left:46px;letter-spacing:1px}
.search{margin-top:18px;background:#fff;border-radius:14px;padding:7px;display:flex;align-items:center;box-shadow:0 10px 28px rgba(15,23,42,.25);position:relative;z-index:30}
.search .s-ic{font-size:17px;padding:0 4px 0 12px;color:var(--gy)}
.search input{flex:1;border:0;outline:0;font-size:15px;padding:9px 8px;color:var(--t);background:transparent;min-width:0}
.search input::placeholder{color:#a8b3c4}
.search button{background:var(--p);color:#fff;border:0;border-radius:9px;padding:10px 24px;font-size:14px;cursor:pointer;white-space:nowrap;font-family:inherit}
.search button:hover{background:var(--pd)}
.qtabs{display:flex;gap:8px;margin-top:14px}
.qtabs span{padding:5px 16px;border-radius:18px;font-size:12.5px;cursor:pointer;background:rgba(255,255,255,.14);color:rgba(255,255,255,.85);transition:.15s;user-select:none}
.qtabs span.on{background:#fff;color:var(--p);font-weight:600}
.qchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.qchips span{font-size:12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);padding:4px 12px;border-radius:14px;cursor:pointer;color:rgba(255,255,255,.9)}
.qchips span:hover{background:rgba(255,255,255,.24)}
/* ===== 搜索建议 ===== */
.sug{position:absolute;top:calc(100% + 8px);left:0;right:0;background:#fff;border-radius:12px;box-shadow:0 16px 40px rgba(15,23,42,.28);overflow:hidden;max-height:400px;overflow-y:auto;text-align:left}
.sug .g{font-size:11px;color:var(--gy);padding:9px 16px 3px;letter-spacing:1px}
.sug .it{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;cursor:pointer;border-bottom:1px solid #f1f5f9}
.sug .it:last-child{border-bottom:0}
.sug .it:hover{background:#eff6ff}
.sug .it .l{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--t)}
.sug .it .l .tp{font-size:11px;color:var(--sub);background:#f1f5f9;padding:1px 8px;border-radius:4px}
.sug .it .sc{font-weight:700;font-size:13px}
.sug .none{padding:16px;color:var(--gy);font-size:13px;text-align:center}
/* ===== 主体 ===== */
.main{max-width:920px;margin:-36px auto 0;padding:0 20px}
.card{background:var(--card);border-radius:12px;box-shadow:0 1px 3px rgba(15,23,42,.07);padding:20px;margin-bottom:16px}
.card h3{font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:7px}
.card h3 .cnt{font-size:11px;color:var(--gy);font-weight:400;margin-left:auto}
/* 统计条 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.st{background:var(--card);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(15,23,42,.07)}
.st .n{font-size:26px;font-weight:700}
.st .l{font-size:12px;color:var(--sub);margin-top:3px}
/* 两大入口 */
.entries{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.entry{background:var(--card);border-radius:14px;padding:22px;cursor:pointer;box-shadow:0 1px 3px rgba(15,23,42,.07);border:1px solid transparent;transition:.18s;position:relative;overflow:hidden}
.entry:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(15,23,42,.12);border-color:var(--p)}
.entry .ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:23px;margin-bottom:12px}
.entry.m .ic{background:#eff6ff}.entry.p .ic{background:#ecfdf5}
.entry .tt{font-size:17px;font-weight:700}
.entry .ds{font-size:12.5px;color:var(--sub);margin-top:5px;line-height:1.7}
.entry .go{position:absolute;right:16px;bottom:14px;font-size:12px;color:var(--p)}
/* 筛选 chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chips span{padding:6px 14px;border-radius:16px;font-size:12.5px;cursor:pointer;background:#fff;border:1px solid var(--b);color:var(--sub);transition:.15s;user-select:none}
.chips span.on{background:var(--p);border-color:var(--p);color:#fff;font-weight:600}
/* 列表卡片 */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.gcard{background:var(--card);border-radius:12px;padding:16px;cursor:pointer;box-shadow:0 1px 3px rgba(15,23,42,.07);transition:.18s;border:1px solid transparent;display:flex;flex-direction:column;gap:8px}
.gcard:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,23,42,.12);border-color:var(--p)}
.gcard .r1{display:flex;align-items:center;gap:8px}
.gcard .nm{font-size:15px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .tp{font-size:11px;color:#475569;background:#f1f5f9;padding:2px 8px;border-radius:4px;white-space:nowrap}
.gcard .r2{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--sub);flex-wrap:wrap}
.gcard .r3{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:4px}
.gcard .sc{font-size:22px;font-weight:800}
.gcard .gd{font-size:11px;color:var(--gy)}
.gcard .xq{font-size:11px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 标签 */
.tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:4px;font-weight:600;white-space:nowrap}
.tag.g{background:#ecfdf5;color:#047857}.tag.b{background:#eff6ff;color:#1d4ed8}.tag.r{background:#fef2f2;color:#b91c1c}
.tag.o{background:#fffbeb;color:#b45309}.tag.y{background:#f8fafc;color:#64748b}
/* ===== 详情 ===== */
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);cursor:pointer;margin-bottom:14px;padding:6px 12px;background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(15,23,42,.07);user-select:none}
.back:hover{color:var(--p)}
.dh{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.dh .info{flex:1;min-width:220px}
.dh .nm{font-size:24px;font-weight:800;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dh .sub{font-size:12.5px;color:var(--sub);margin-top:7px;line-height:1.8}
.ring{position:relative;width:96px;height:96px;flex-shrink:0}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:24px;font-weight:800}
.ring .num span{font-size:10.5px;color:var(--sub)}
.funnel{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.fn{border-radius:10px;padding:11px 8px;text-align:center;font-size:11px;border:1px solid;line-height:1.5}
.fn .st{font-weight:700}
.fn.ok{background:#ecfdf5;border-color:#a7f3d0;color:#047857}
.fn.ing{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8}
.fn.warn{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
.fn.wait{background:#f8fafc;border-color:#e2e8f0;color:#94a3b8}
.quals{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ql{border:1px solid var(--b);border-radius:10px;padding:12px}
.ql .k{font-size:11px;color:var(--gy);margin-bottom:5px;letter-spacing:1px}
.ql .v{font-size:13px;font-weight:600;line-height:1.5}
.ql .v.ok{color:var(--g)}.ql .v.warn{color:var(--r)}.ql .v.ing{color:#1d4ed8}
.perfs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pf{border-radius:10px;padding:13px;background:#f8fafc}
.pf .k{font-size:11px;color:var(--sub)}
.pf .v{font-size:19px;font-weight:800;margin-top:3px}
.pf .bar{height:5px;background:#e2e8f0;border-radius:3px;margin-top:7px;overflow:hidden}
.pf .bar i{display:block;height:100%;border-radius:3px;background:var(--p)}
.tl{position:relative;padding-left:8px}
.tl:before{content:'';position:absolute;left:14px;top:6px;bottom:6px;width:2px;background:var(--b)}
.tl-it{position:relative;padding:7px 0 7px 26px}
.tl-it:before{content:'';position:absolute;left:9px;top:14px;width:10px;height:10px;border-radius:50%;background:#cbd5e1;border:2px solid #fff;box-shadow:0 0 0 2px #cbd5e1}
.tl-it.plus:before{background:#10b981;box-shadow:0 0 0 2px #a7f3d0}
.tl-it.minus:before{background:#f87171;box-shadow:0 0 0 2px #fecaca}
.tl-it .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tl-it .ev{font-size:13px;line-height:1.6}
.tl-it .dt{font-size:11px;color:var(--gy);white-space:nowrap}
.tl-it .pt{font-size:12px;font-weight:700}
.tl-it.plus .pt{color:#059669}.tl-it.minus .pt{color:#dc2626}.tl-it .pt.zero{color:#94a3b8}
.trend{display:flex;align-items:flex-end;gap:10px;height:110px;padding-top:6px}
.trend .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.trend .bar{width:100%;max-width:34px;border-radius:5px 5px 0 0;background:linear-gradient(180deg,#60a5fa,#2563eb);min-height:4px}
.trend .val{font-size:10.5px;color:var(--sub)}
.trend .mo{font-size:10px;color:var(--gy)}
.xqtags{display:flex;flex-wrap:wrap;gap:8px}
.xqtags span{font-size:12px;background:#eff6ff;color:#1d4ed8;padding:4px 12px;border-radius:14px}
.vetob{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:11px 14px;font-size:12.5px;color:#92400e;line-height:1.7}
.vetob.ok{background:#f0fdf4;border-color:#bbf7d0;color:#166534}
.notice{background:#f8fafc;border:1px dashed var(--b);border-radius:10px;padding:12px 15px;font-size:12px;color:var(--sub);line-height:1.8}
/* 人员详情 */
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ps{border:1px solid var(--b);border-radius:10px;padding:13px;text-align:center}
.ps .v{font-size:20px;font-weight:800}
.ps .k{font-size:11px;color:var(--sub);margin-top:3px}
.stars{color:#f59e0b;font-size:13px;letter-spacing:1px}
/* 页脚 */
.footer{max-width:920px;margin:30px auto 40px;padding:0 20px;color:#94a3b8;font-size:11.5px;line-height:2}
.footer b{color:#64748b}
.empty{padding:40px;text-align:center;color:var(--gy);font-size:13.5px}
.empty .big{font-size:34px;margin-bottom:10px}
@media(max-width:760px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .entries{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
  .funnel{grid-template-columns:repeat(3,1fr)}
  .quals{grid-template-columns:repeat(2,1fr)}
  .perfs{grid-template-columns:repeat(2,1fr)}
  .pstats{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>

/* --- 搜索 --- */
function searchItems(q){
  q=(q||'').trim();
  if(!q)return {m:[],p:[]};
  var lm=function(k){return q.length>=2&&MERCHANTS[k].name.indexOf(q)>=0;};
  var fm=[];for(var k=0;k<MERCHANTS.length;k++){if(lm(k))fm.push(k);}
  // 类型关键词匹配
  if(!fm.length){for(var k2=0;k2<MERCHANTS.length;k2++){if(MERCHANTS[k2].type.indexOf(q)>=0)fm.push(k2);}}
  var fp=[];for(var j=0;j<PERSONNEL.length;j++){if(q.length>=2&&(PERSONNEL[j].name.indexOf(q)>=0||PERSONNEL[j].type.indexOf(q)>=0))fp.push(j);}
  return {m:fm,p:fp};
}
function onInput(v){
  S.q=v;
  var sug=document.getElementById('sug');
  if(!sug)return;
  if(!v||v.trim().length<2){sug.style.display='none';return;}
  var r=searchItems(v),h='';
  if(S.qt==='all'||S.qt==='m'){
    if(r.m.length){h+='<div class="g">商家</div>';
      r.m.slice(0,5).forEach(function(i){var m=MERCHANTS[i];h+='<div class="it" onclick="goDetail(&#39;m&#39;,'+i+')"><div class="l">'+esc(m.name)+'<span class="tp">'+m.type+'</span></div><span class="sc" style="color:'+scoreColor(m.score)+'">'+m.score+'分</span></div>';});
    }
  }
  if(S.qt==='all'||S.qt==='p'){
    if(r.p.length){h+='<div class="g">服务人员</div>';
      r.p.slice(0,5).forEach(function(i){var p=PERSONNEL[i];h+='<div class="it" onclick="goDetail(&#39;p&#39;,'+i+')"><div class="l">'+p.name+'<span class="tp">'+p.type+'</span><span class="tp">'+p.id+'</span></div><span class="sc" style="color:'+scoreColor(p.score)+'">'+p.score+'分</span></div>';});
    }
  }
  if(!h)h='<div class="none">未找到相关商家或服务人员</div>';
  sug.innerHTML=h;
  sug.style.display='block';
}
function doSearch(){
  var v=document.getElementById('qin').value;S.q=v;
  var r=searchItems(v);
  var sug=document.getElementById('sug');if(sug)sug.style.display='none';
  if(S.qt==='p'){
    if(r.p.length){goDetail('p',r.p[0]);return;}
  }else{
    if(r.m.length){goDetail('m',r.m[0]);return;}
    if(r.p.length){goDetail('p',r.p[0]);return;}
  }
  // 无精确匹配：进入列表并提示
  S.cat='全部';
  S.nores=v||'';
  S.view=S.qt==='p'?'plist':'mlist';
  render();
}
function onKey(e){if(e.key==='Enter')doSearch();}
function setQt(k){S.qt=k;S.q='';S.nores='';render();}
function goSearch(name){S.q=name;S.view='home';render();var r=searchItems(name);if(r.m.length){goDetail('m',r.m[0]);}else if(r.p.length){goDetail('p',r.p[0]);}}

function goDetail(kind,idx){S.view=kind==='m'?'mdetail':'pdetail';S.idx=idx;S.nores='';render();}
function ringSVG(sc,color){
  var C=2*Math.PI*40,off=C*(1-sc/100);

}
function vMDetail(){
  var m=MERCHANTS[S.idx];
  var fn=m.funnel.map(function(s,i){
    var cls=s===1?'ok':(s===0?'ing':(s===-1?'warn':'wait'));

    return '<div class="fn '+cls+'"><div class="st">'+st+'</div>'+LAYERS[i]+'</div>';

    +'<div class="ql"><div class="k">司法风险</div><div class="v '+(m.jud.indexOf('涉诉')>=0?'warn':'ok')+'">'+m.jud+'</div></div>'

  var pf=[['响应率',m.perf.resp,'%'],['闭环率',m.perf.close,'%'],['满意度',m.perf.sat,'/5'],['履约完成率',m.perf.comp,'%']].map(function(x){
    var v=x[1];
    var val=(x[2]==='/5')?(v/5*100):v;
    var display=(x[2]==='/5')?v.toFixed(1)+' / 5':v+(v===0?' — 尚无履约数据':'%');
    return '<div class="pf"><div class="k">'+x[0]+'</div><div class="v" style="color:'+(v===0?'#94a3b8':'#1e293b')+'">'+display+'</div><div class="bar"><i style="width:'+val+'%"></i></div></div>';
  }).join('');
  var tl=m.events.map(function(e){
    var t=e[2];
    var cls=t==='+'?'plus':(t==='-'?'minus':'');
    var ptTxt=t==='+'?'＋':(t==='-'?'－':'·');
    var ptCls=t==='+'?'':'zero';
    return '<div class="tl-it '+cls+'"><div class="row"><span class="ev">'+e[1]+'</span><span class="dt">'+e[0]+'</span></div><div class="pt '+ptCls+'">'+ptTxt+'</div></div>';
  }).join('');

  var tr=m.trend.map(function(v,i){
    var hh=v===0?3:(8+(v-minT)/spanT*76);
    return '<div class="col"><span class="val">'+(v===0?'—':v.toFixed(1))+'</span><div class="bar" style="height:'+hh+'px;background:'+(v===0?'#e2e8f0':'linear-gradient(180deg,#60a5fa,#2563eb)')+'"></div><span class="mo">'+(i+3)+'月</span></div>';
  }).join('');

    ?'<div class="vetob ok">✓ 无一票否决项 · 未触发任何排除规则</div>'
    :(m.veto==='审核中'
      ?'<div class="vetob">⏳ 审核中：六层漏斗核验未完成，暂不对外推荐</div>'
      :'<div class="vetob">⚠ '+m.veto+'</div>');

    +'<div class="card"><div class="dh">'
    +'<div class="info"><div class="nm">'+esc(m.name)+tierTag(m.tier)+mStatusTag(m.status)+'</div>'
    +'<div class="sub"><span class="tp" style="font-size:11px;color:#475569;background:#f1f5f9;padding:2px 8px;border-radius:4px">'+m.type+'</span> 信用等级 '+m.grade+' · 档案编号 '+m.id+'</div></div>'
    +ringSVG(m.score,scoreColor(m.score))
    +'</div></div>'
    +'<div class="card"><h3>🛡 六层漏斗核验</h3>'+((m.fLabel)?'<div class="vetob" style="margin-bottom:10px">'+m.fLabel+'</div>':'')+'<div class="funnel">'+fn+'</div></div>'
    +'<div class="card"><h3>📋 资质信息</h3><div class="quals">'+quals+'</div></div>'
    +'<div class="card"><h3>📈 履约表现</h3><div class="perfs">'+pf+'</div></div>'
    +'<div class="card"><h3>🕐 信用记录时间线</h3><div class="tl">'+tl+'</div></div>'
    +'<div class="card"><h3>📊 近6月履约满意度趋势</h3><div class="trend">'+tr+'</div></div>'
    +'<div class="card"><h3>🏘 服务小区</h3><div class="xqtags">'+m.xqs.map(function(x){return '<span>'+x+'</span>';}).join('')+'</div>'
    +'<div style="margin-top:10px;font-size:12px;color:#94a3b8">'+m.eco+'</div></div>'
    +'<div class="card">'+veto+'</div>'
    +'</div>';
}

/* --- 人员列表 --- */
function goPList(cat){S.view='plist';S.cat=cat;S.q='';S.nores='';render();}
function vPList(){
  var list=PERSONNEL.filter(function(p){return S.cat==='全部'||p.type===S.cat;});
  var chips='<span class="'+(S.cat==='全部'?'on':'')+'" onclick="goPList(&#39;全部&#39;)">全部 '+PERSONNEL.length+'</span>'
    +PTYPES.map(function(t){var c=PERSONNEL.filter(function(p){return p.type===t;}).length;return c?'<span class="'+(S.cat===t?'on':'')+'" onclick="goPList(&#39;'+t+'&#39;)">'+t+' '+c+'</span>':'';}).join('');
  var cards=list.map(function(p){
    var idx=PERSONNEL.indexOf(p);
    return '<div class="gcard" onclick="goDetail(&#39;p&#39;,'+idx+')">'
      +'<div class="r1"><span class="nm">'+p.name+'</span><span class="tp">'+p.id+'</span></div>'
      +'<div class="r2"><span class="tp">'+p.type+'</span>'+pStatusTag(p.status)+'</div>'
      +'<div class="xq">🏘 '+p.zone+'</div>'
      +(p.orders?'<div class="xq">'+p.orders+' 单工单 · 平均 '+p.avgTime+' 分钟 · '+p.sat.toFixed(1)+'★</div>':'<div class="xq">'+(p.units?p.units+' 户':'服务留痕中')+'</div>')
      +'<div class="r3"><span class="sc" style="color:'+scoreColor(p.score)+'">'+p.score+'</span><span class="gd">信用分 · '+p.grade+'</span><span style="font-size:11px;color:#94a3b8">查看档案 →</span></div>'
      +'</div>';
  }).join('');
  if(!cards)cards='<div class="empty"><div class="big">🔍</div>该岗位下暂无服务人员</div>';
  return '<div class="main"><span class="back" onclick="S.view=&#39;home&#39;;render()">← 返回首页</span>'
    +'<div class="card"><h3>👷 服务人员信用查询 <span class="cnt">'+S.cat+' · '+list.length+' 名</span></h3>'
    +noresBar()
    +'<div class="chips">'+chips+'</div><div class="grid">'+cards+'</div></div></div>';
}

/* --- 人员详情 --- */
function vPDetail(){
  var p=PERSONNEL[S.idx];
  var tl=p.events.map(function(e){
    var plus=e[1].charAt(0)==='+',minus=e[1].charAt(0)==='-';
    var cls=plus?'plus':(minus?'minus':'');
    return '<div class="tl-it '+cls+'"><div class="row"><span class="ev">'+e[0]+'</span><span class="dt">'+e[1]+'</span></div><div class="pt '+(plus?'':'zero')+'">'+(plus||minus?e[1]+' 分':'已记录')+'</div></div>';
  }).join('');
  var st=p.orders
    ?'<div class="ps"><div class="v" style="color:#2563eb">'+p.orders+'</div><div class="k">累计工单数</div></div>'
     +'<div class="ps"><div class="v" style="color:#2563eb">'+p.avgTime+'</div><div class="k">平均耗时（分钟）</div></div>'
     +'<div class="ps"><div class="v" style="color:#d97706">'+p.sat.toFixed(1)+'</div><div class="k">业主满意度 '+stars(p.sat)+'</div></div>'
    :'<div class="ps"><div class="v" style="color:#2563eb">'+(p.units||'—')+'</div><div class="k">服务户数</div></div>'
     +'<div class="ps"><div class="v" style="color:#2563eb">'+p.zone.split(' ')[0]+'</div><div class="k">服务小区</div></div>'
     +'<div class="ps"><div class="v" style="color:#2563eb">'+p.type+'</div><div class="k">服务岗位</div></div>';
  return '<div class="main"><span class="back" onclick="S.view=&#39;plist&#39;;render()">← 返回人员列表</span>'
    +'<div class="card"><div class="dh">'
    +'<div class="info"><div class="nm">'+p.name+'<span class="tp" style="font-size:11px;color:#475569;background:#f1f5f9;padding:2px 8px;border-radius:4px;font-weight:400">'+p.id+'</span>'+pStatusTag(p.status)+'</div>'
    +'<div class="sub">'+p.type+' · '+p.zone+' · 信用等级 '+p.grade+'</div></div>'
    +ringSVG(p.score,scoreColor(p.score))
    +'</div></div>'
    +'<div class="card"><h3>📈 服务履约数据</h3><div class="pstats">'+st+'</div></div>'
    +'<div class="card"><h3>🕐 信用变动记录</h3>'
    +'<div class="notice" style="margin-bottom:12px">信用分=服务履约留痕滚动汇总（按时完成+1 · 按时+好评+2 · 文字表扬+3 · 超时-1 · 严重超时-3 · 验证未通过-5），公开透明，业主可随时查询。</div>'
    +'<div class="tl">'+tl+'</div></div>'
    +'<div class="card"><div class="vetob ok">✓ 人员信息已脱敏展示：仅公开工号、岗位与履约留痕，不含个人联系方式</div></div>'
    +'</div>';
}

/* --- 页脚 --- */
function footerHTML(){
  return '<div class="footer"><b>数治理方 · 资质查询</b> —— 数据来源：商家资质信息来自公开政务数据与平台六层漏斗核验留痕；服务人员信用分为平台服务履约留痕汇总。<br>'
    +'平台对任何主体只做行为事实留痕，不做评价性画像；查询结果仅供业主了解服务履约情况，不构成任何推荐、评级或权利分配意见。'
    +' 杭州个信数治信用管理有限公司 · mingjian.sh.cn</div>';
}

render();
</script>
