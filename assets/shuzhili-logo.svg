<svg width="120" height="40" viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0099ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ccff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="20" cy="20" r="16" fill="url(#logoGradient)" opacity="0.2"/>
  
  <!-- Main icon - representing data governance -->
  <g filter="url(#glow)">
    <!-- Data nodes -->
    <circle cx="15" cy="15" r="3" fill="white" opacity="0.9"/>
    <circle cx="25" cy="15" r="3" fill="white" opacity="0.9"/>
    <circle cx="20" cy="25" r="3" fill="white" opacity="0.9"/>
    
    <!-- Connecting lines -->
    <line x1="15" y1="15" x2="25" y2="15" stroke="white" stroke-width="1.5" opacity="0.8"/>
    <line x1="20" y1="15" x2="20" y2="25" stroke="white" stroke-width="1.5" opacity="0.8"/>
    <line x1="15" y1="15" x2="20" y2="25" stroke="white" stroke-width="1" opacity="0.6"/>
    <line x1="25" y1="15" x2="20" y2="25" stroke="white" stroke-width="1" opacity="0.6"/>
  </g>
  
  <!-- Brand text -->
  <text x="40" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="url(#logoGradient)">
    数治理方
  </text>
  
  <!-- Subtitle -->
  <text x="40" y="35" font-family="Arial, sans-serif" font-size="8" fill="#666" opacity="0.8">
    Smart Property Management
  </text>
</svg>